<!DOCTYPE html>
<html lang="ko">
<head>

<title>오금교 인라인스케이트장 (멀티)</title>
<style>

</style>
</head>
<body>
<div id="hud"></div>
<canvas id="mini" width="240" height="240"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="jump">점프</div>
<div id="emo"></div>
<div id="msg"></div>
<div id="name"><div style="font-size:22px;font-weight:700">오금교 인라인스케이트장 (멀티)</div><input id="nm" maxlength="12" placeholder="닉네임"><button id="go">입장</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
// ---------- 시드 난수 (모든 접속자가 같은 섬을 만들도록) ----------
var _seed=20261119;
function R(){_seed|=0;_seed=_seed+0x6D2B79F5|0;var t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
// ---------- 노이즈 ----------
function hash(x,y){var s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
 var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 var a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){var s=0,a=.5,f=1;for(var i=0;i<5;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2}return s}
var SIZE=400,HALF=SIZE/2,WATER=-1.5;
// ---- 오금교 인라인스케이트장 일대 (안양천 변) : 좌표계 u(하천 방향), v(하천 직각 방향) ----
function toU(x,z){return .8*x-.6*z}
function toV(x,z){return .6*x+.8*z}
function wx(u,v){return .8*u+.6*v}
function wz(u,v){return -.6*u+.8*v}
var ROT=Math.atan2(.6,.8);
var RINK={u:0,v:-20,L:55,R:25};
var RIVER_V=85,ROAD_V=-95;
var BR={u:-110,half:5,v0:30,v1:140,top:1.3};
var COURTS=[-62,-34,-6];
function sst(a,b,x){var t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
function rinkDist(u,v){var du=Math.max(Math.abs(u-RINK.u)-RINK.L,0),dv=v-RINK.v;return Math.sqrt(du*du+dv*dv)}
function height(x,z){
 var v=toV(x,z),d=Math.abs(v-RIVER_V);
 return .5-4.5*sst(36,26,d);
}
function onDeck(x,z){var u=toU(x,z),v=toV(x,z);return Math.abs(u-BR.u)<BR.half&&v>BR.v0&&v<BR.v1}
function ground(x,z,y){var h=height(x,z);if(onDeck(x,z)&&y>=BR.top-1.2)return BR.top;return h}
function surfaceColor(x,z){
 var u=toU(x,z),v=toV(x,z),h=height(x,z),n=hash(Math.floor(x/2),Math.floor(z/2))*.05;
 var d=Math.abs(v-RIVER_V);
 if(d<36){
  if(h<WATER+.6)return [.8,.74,.5];
  if(d>36-1)return [.78,.62,.42];
  return [.36+n,.55+n,.3];
 }
 if(d<42&&d>=36)return [.78,.62,.42]; // 하천변 자전거길
 var rd=rinkDist(u,v);
 if(rd<RINK.R+4){
  if(rd<RINK.R){
   if(Math.abs(rd-RINK.R)<.7||Math.abs(rd-12)<.5)return [.95,.95,.95];
   if(Math.abs(rd-18.5)<.25)return [.75,.75,.8];
   if(rd<12)return [.5,.76,.42];
   return [.3,.31,.35];
  }
  return [.72,.72,.74];
 }
 for(var i=0;i<COURTS.length;i++){var du=Math.abs(u-105),dv=Math.abs(v-COURTS[i]);
  if(du<16&&dv<17){
   if(du<12&&dv<13){
    if(Math.abs(du-6)<.25&&dv<12||Math.abs(dv-12)<.25&&du<6||Math.abs(dv)<.2&&du<6||Math.abs(du)<.2&&dv<6)return [.95,.95,.95];
    return [.18,.48,.68];
   }
   return [.22,.58,.4];
  }}
 var rv=Math.abs(v-ROAD_V);
 if(rv<8)return Math.abs(rv)<.4&&((Math.floor(u/6)&1)===0)?[.9,.85,.3]:[.3,.3,.33];
 if(rv<11)return [.76,.76,.73];
 if(v<-108&&v>-134&&u>-110&&u<70)return [.8,.72,.55]; // 운동장
 return [.44+n,.68+n,.32];
}
// ---------- 씬 ----------

var water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE).rotateX(-Math.PI/2),

water.position.y=WATER;scene.add(water);
var blockers=[];

// 오금교 (다리)
(function(){var len=BR.v1-BR.v0,cu=BR.u,cv=(BR.v0+BR.v1)/2,cx=wx(cu,cv),cz=wz(cu,cv);

 [-1,1].forEach(function(s){var ox=wx(cu+s*(BR.half-.3),cv),oz=wz(cu+s*(BR.half-.3),cv);box(.3,1.1,len,0xffffff,ox,BR.top+.55,oz,ROT)});
 [58,112].forEach(function(v){var m=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,6,10),new THREE.MeshLambertMaterial({color:0xa9adb3}));m.position.set(wx(cu,v),BR.top-3.2,wz(cu,v));scene.add(m)});
 sign('오금교',9,2.4,wx(cu,BR.v0-3),4,wz(cu,BR.v0-3),'#2d7d4f');
})();
// 인라인스케이트장 간판
sign('오금교 인라인스케이트장',16,4,wx(RINK.u-RINK.L-RINK.R-6,RINK.v),7,wz(RINK.u-RINK.L-RINK.R-6,RINK.v),'#1b5fa8');
box(.5,7,.5,0x555555,wx(RINK.u-RINK.L-RINK.R-6,RINK.v-9),3.5,wz(RINK.u-RINK.L-RINK.R-6,RINK.v-9));
box(.5,7,.5,0x555555,wx(RINK.u-RINK.L-RINK.R-6,RINK.v+9),3.5,wz(RINK.u-RINK.L-RINK.R-6,RINK.v+9));
// 목일중학교
(function(){var cu=-20,cv=-142;var cx=wx(cu,cv),cz=wz(cu,cv);
 box(92,22,16,0xe6dccb,cx,11.5,cz,ROT);box(92,1.2,17,0x8a7a66,cx,23,cz,ROT);
 for(var f=0;f<3;f++)box(90,2.4,.4,0x6c8fb3,wx(cu,cv+8.2),5+f*7,wz(cu,cv+8.2),ROT);
 sign('목일중학교',18,4.5,wx(cu,cv+8.6),18.5,wz(cu,cv+8.6),'#3a4a78');
 for(var k=-45;k<=45;k+=8)blockers.push([wx(cu+k,cv),wz(cu+k,cv),9]);
})();
// 신정교 테니스장 펜스/네트
COURTS.forEach(function(vc){box(.15,1.1,10,0xeeeeee,wx(105,vc),.9,wz(105,vc),ROT+Math.PI/2)});
// 나무 & 돌
var trunkG=new THREE.CylinderGeometry(.25,.35,2,6),leafG=new THREE.ConeGeometry(1.6,4,7),rockG=new THREE.DodecahedronGeometry(1,0);
var TREES=700,trunks=new THREE.InstancedMesh(trunkG,new THREE.MeshLambertMaterial({color:0x6b4a2b}),TREES),
 leaves=new THREE.InstancedMesh(leafG,new THREE.MeshLambertMaterial({color:0x2f8f3f}),TREES),
 rocks=new THREE.InstancedMesh(rockG,new THREE.MeshLambertMaterial({color:0x8d8d8d}),80);
var m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
var tn=0,rn=0;
function addTree(x,z){if(tn>=TREES||Math.abs(x)>HALF-6||Math.abs(z)>HALF-6)return;var h=height(x,z);if(h<WATER+1.5)return;
 var sc=.8+R()*.8;s.set(sc,sc,sc);p.set(x,h+sc,z);m.compose(p,q,s);trunks.setMatrixAt(tn,m);
 p.set(x,h+2*sc+1.6*sc,z);m.compose(p,q,s);leaves.setMatrixAt(tn,m);blockers.push([x,z,.6*sc]);tn++}
function freeSpot(u,v){var rd=rinkDist(u,v);if(rd<RINK.R+6)return false;
 if(Math.abs(u-105)<20&&v>-82&&v<22)return false;
 if(Math.abs(v-ROAD_V)<14)return false;
 if(v<-104&&v>-160&&u>-80&&u<45)return false;
 if(Math.abs(u-BR.u)<10&&v>BR.v0-6&&v<BR.v1)return false;
 if(u<RINK.u-RINK.L-RINK.R-3&&u>RINK.u-RINK.L-RINK.R-14&&Math.abs(v-RINK.v)<14)return false;
 return true}
// 가로수 (도로변)
for(var u0=-230;u0<=230;u0+=11){var vv=ROAD_V+13;if(freeSpot(u0,vv))addTree(wx(u0,vv)+R()-.5,wz(u0,vv)+R()-.5)}
// 하천변 가로수
for(var u0=-230;u0<=230;u0+=13){[RIVER_V-45,RIVER_V+45].forEach(function(vv){if(freeSpot(u0,vv))addTree(wx(u0,vv)+R()*2-1,wz(u0,vv)+R()*2-1)})}
// 공원 숲
for(var t=0;t<6000&&tn<TREES;t++){var x=(R()-.5)*SIZE,z=(R()-.5)*SIZE,u=toU(x,z),v=toV(x,z);
 var park=(v>-86&&v<42)||(v>130&&v<230)||(v<-165);
 if(!park||!freeSpot(u,v))continue;
 if(vnoise(x*.04,z*.04)<.5)continue;
 addTree(x,z)}
trunks.count=leaves.count=tn;scene.add(trunks);scene.add(leaves);
for(var t=0;t<2000&&rn<80;t++){var d0=(R()<.5?-1:1)*(33+R()*3),vv=RIVER_V+d0,uu=(R()-.5)*360,x=wx(uu,vv),z=wz(uu,vv);
 if(Math.abs(x)>HALF-6||Math.abs(z)>HALF-6||Math.abs(uu-BR.u)<8)continue;
 var sc=.5+R()*1.0,h=height(x,z);s.set(sc,sc*.7,sc);p.set(x,h+sc*.2,z);q.setFromEuler(new THREE.Euler(R(),R()*6,0));
 m.compose(p,q,s);rocks.setMatrixAt(rn,m);blockers.push([x,z,sc*.9]);rn++}
rocks.count=rn;scene.add(rocks);q.identity();
// 주변 아파트 스카이라인
for(var i=0;i<70;i++){var side=Math.floor(R()*4),a=(R()-.5)*SIZE*1.3,off=HALF+8+R()*45,w=18+R()*14,hh=45+R()*40,x,z;
 if(side===0){x=a;z=-off}else if(side===1){x=a;z=off}else if(side===2){x=-off;z=a}else{x=off;z=a}
 var g=.78+R()*.15;box(w,hh,w*.7,new THREE.Color(g,g,g*.97).getHex(),x,hh/2-6,z)}
// 수정 (수집품)
var crystals=[],cG=new THREE.OctahedronGeometry(.7),cM=new THREE.MeshLambertMaterial({color:0x66e0ff,emissive:0x2288aa});
var TOTAL=25;
[-80,-40,0,40].forEach(function(u){} );
for(var t=0;t<8000&&crystals.length<TOTAL;t++){
 var x,z,base;
 if(crystals.length<4){var vv=BR.v0+20+R()*(BR.v1-BR.v0-40);x=wx(BR.u,vv);z=wz(BR.u,vv);base=BR.top}
 else{x=(R()-.5)*SIZE*.9;z=(R()-.5)*SIZE*.9;var u=toU(x,z),v=toV(x,z);
  if(v<-100||v>200||height(x,z)<WATER+.5||!freeSpot(u,v)&&rinkDist(u,v)>=RINK.R+6)continue;
  base=height(x,z)}
 var c=new THREE.Mesh(cG,cM);c.position.set(x,base+1.5,z);c.userData.base=base;scene.add(c);crystals.push(c);
}
// 캐릭터
var player=new THREE.Group();
var body=new THREE.Group();

var torso=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.9,10),bm);torso.position.y=0;body.add(torso);
var head=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),bm);head.position.y=.5;body.add(head);
var feet=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),bm);feet.position.y=-.45;body.add(feet);
body.position.y=.8;player.add(body);
var nose=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,.3),new THREE.MeshLambertMaterial({color:0xffffff}));
nose.position.set(0,1.1,.4);player.add(nose);
scene.add(player);
var camYaw0=0;var pp={x:0,z:0,y:0,vy:0,yaw:0,onGround:true};
// 시작점: 육지 찾기
pp.x=wx(-75,-50);pp.z=wz(-75,-50);pp.y=height(pp.x,pp.z);camYaw0=0;
// ---------- 입력 ----------
var keys={},camYaw=0,camPitch=.45,drag=null,isTouch='ontouchstart' in window;
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')e.preventDefault()});

var joy={x:0,y:0},joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),jumpEl=document.getElementById('jump');

// ---------- 미니맵 ----------

(function(){var g=mapImg.getContext('2d'),im=g.createImageData(120,120);

  im.data[k]=c[0];im.data[k+1]=c[1];im.data[k+2]=c[2];im.data[k+3]=255}

function drawMini(){mc.drawImage(mapImg,0,0,240,240);

 mc.font='bold 18px sans-serif';mc.textAlign='center';mc.lineWidth=3;
 for(var id in remotes){var r=remotes[id];if(!r.init)continue;var rx=(r.g.position.x/SIZE+.5)*240,rz=(r.g.position.z/SIZE+.5)*240;
  mc.fillStyle=r.color||'#ff0';mc.beginPath();mc.arc(rx,rz,5,0,6.28);mc.fill();mc.strokeStyle='#fff';mc.lineWidth=2;mc.stroke();
  mc.lineWidth=3;mc.strokeStyle='#000';mc.strokeText(r.name,rx,rz-9);mc.fillStyle='#fff';mc.fillText(r.name,rx,rz-9)}
 mc.fillStyle='#e85d4a';mc.beginPath();mc.arc((pp.x/SIZE+.5)*240,(pp.z/SIZE+.5)*240,6,0,6.28);mc.fill();mc.strokeStyle='#fff';mc.lineWidth=2;mc.stroke()}
// ---------- 게임 루프 ----------
var hud=document.getElementById('hud'),msg=document.getElementById('msg'),score=0,last=performance.now(),time=0,done=false;
function say(t,ms){msg.textContent=t;msg.style.opacity=1;setTimeout(function(){msg.style.opacity=0},ms||1500)}
function tick(now){
 var dt=Math.min((now-last)/1000,.05);last=now;time+=dt;dt_=dt;if(started)netTick(now);bubbleTick(dt);
 // 이동 입력 (카메라 기준)
 var ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,
     iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
 var il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;il=1}
 var inWater=pp.y<WATER-.2;
 var speed=(keys.ShiftLeft||keys.ShiftRight?11:6)*(inWater?.5:1);
 if(il>.05){
  var sy=Math.sin(camYaw),cy=Math.cos(camYaw);
  var dx=(ix*cy+iz*sy)*speed*dt,dz=(-ix*sy+iz*cy)*speed*dt;
  var nx=pp.x+dx,nz=pp.z+dz,ok=true;
  for(var i=0;i<blockers.length;i++){var b=blockers[i],ex=nx-b[0],ez=nz-b[1];if(ex*ex+ez*ez<(b[2]+.4)*(b[2]+.4)){ok=false;break}}
  var nh=ground(nx,nz,pp.y);
  if(Math.abs(nx)>HALF-2||Math.abs(nz)>HALF-2)ok=false;
  if(nh-pp.y>1.2&&pp.onGround)ok=false; // 너무 가파른 경사
  if(ok){pp.x=nx;pp.z=nz}
  pp.yaw=Math.atan2(dx,dz);
 }
 // 점프 & 중력
 var gh=Math.max(ground(pp.x,pp.z,pp.y),WATER-1.5);
 if((keys.Space||jumpReq)&&pp.onGround){pp.vy=8;pp.onGround=false}
 jumpReq=false;
 pp.vy-=22*dt;pp.y+=pp.vy*dt;
 if(pp.y<=gh){pp.y=gh;pp.vy=0;pp.onGround=true}else if(pp.y-gh>.15)pp.onGround=false;
 player.position.set(pp.x,pp.y,pp.z);
 player.rotation.y+= (pp.yaw-player.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI;
 body.position.y=.8+(il>.05&&pp.onGround?Math.abs(Math.sin(time*10))*.12:0);
 // 수정
 crystals.forEach(function(c,i){if(!c.visible)return;c.rotation.y=time*2+i;c.position.y=c.userData.base+1.5+Math.sin(time*2+i)*.25;
  var dx=c.position.x-pp.x,dz=c.position.z-pp.z;
  if(started&&dx*dx+dz*dz<2.5&&Math.abs(c.position.y-pp.y-1)<2.5){takeCrystal(i,myId);if(sb)sb.from('crystals_taken').insert({id:i,taken_by:myId}).then(function(){});
   if(takenCount()>=TOTAL&&!done){done=true;say('🎉 모든 수정을 함께 모았어요!',6000)}}});
 // 카메라
 var dist=9,cx=pp.x+Math.sin(camYaw)*Math.cos(camPitch)*dist,cz=pp.z+Math.cos(camYaw)*Math.cos(camPitch)*dist,cyy=pp.y+2+Math.sin(camPitch)*dist;
 cyy=Math.max(cyy,height(cx,cz)+1);
 camera.position.set(cx,cyy,cz);camera.lookAt(pp.x,pp.y+1.5,pp.z);
 water.position.y=WATER+Math.sin(time)*.08;
 hud.innerHTML='💎 내 '+score+' · 전체 '+takenCount()+'/'+TOTAL+'<br>👥 접속 '+online+'명<br>고도 '+Math.round(pp.y)+'m'+(inWater?' · 수영 중':'');
 drawMini();
 renderer.render(scene,camera);
 requestAnimationFrame(tick);
}

// ---------- 멀티플레이 ----------
var SB_URL='https://bcqvqaikyfgzimjmlbfj.supabase.co',SB_KEY='sb_publishable_5LWmOSlxQE_WF9TOpvP7VQ_OaEccaGB';
var myId=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
var myName='',sb=null,chan=null,remotes={},online=1,lastSend=0,netOK=false;
// R()은 시드 고정이라 myId는 시간 기반 보조값과 섞음
myId=(Date.now().toString(36)+Math.floor(performance.now()*1000).toString(36)+Math.floor(Math.random()*1e6).toString(36));
function label(text){var c=document.createElement('canvas');c.width=256;c.height=64;var g=c.getContext('2d');
 g.font='bold 30px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=5;g.strokeText(text,128,44);g.fillText(text,128,44);
 var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(4,1,1);sp.position.y=2.6;sp.renderOrder=10;return sp}
function makeRemote(id,name){var g=new THREE.Group(),hue=0;for(var i=0;i<id.length;i++)hue=(hue*31+id.charCodeAt(i))%360;
 var mat=new THREE.MeshLambertMaterial({color:new THREE.Color('hsl('+hue+',70%,55%)')});
 var a=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.9,10),mat),b=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),mat),c=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),mat);
 a.position.y=.8;b.position.y=1.3;c.position.y=.35;g.add(a);g.add(b);g.add(c);g.add(label(name));scene.add(g);
 return {g:g,tx:0,ty:0,tz:0,yaw:0,seen:performance.now(),name:name,init:false,color:'hsl('+hue+',70%,55%)'}}
function takeCrystal(i,by){var c=crystals[i];if(c&&c.visible){c.visible=false;if(by===myId){score++;say('수정 '+score+' (전체 '+takenCount()+'/'+TOTAL+')',900)}}}
function takenCount(){var n=0;crystals.forEach(function(c){if(!c.visible)n++});return n}
function connect(){
 try{
  sb=supabase.createClient(SB_URL,SB_KEY);
  chan=sb.channel('world',{config:{broadcast:{self:false}}});
  chan.on('broadcast',{event:'pos'},function(m){var d=m.payload;if(!d||d.id===myId)return;
   var r=remotes[d.id];if(!r){r=remotes[d.id]=makeRemote(d.id,d.name||'???')}
   r.tx=d.x;r.ty=d.y;r.tz=d.z;r.yaw=d.yaw;r.seen=performance.now();if(!r.init){r.g.position.set(d.x,d.y,d.z);r.init=true}});
  chan.on('broadcast',{event:'emo'},function(m){var d=m.payload;if(!d||d.id===myId||!remotes[d.id])return;showEmoji(remotes[d.id].g,String(d.e).slice(0,4))});
  chan.on('postgres_changes',{event:'INSERT',schema:'public',table:'crystals_taken'},function(p){takeCrystal(p.new.id,p.new.taken_by)});
  chan.subscribe(function(st){netOK=(st==='SUBSCRIBED');if(netOK)say('멀티 접속 완료!',1500)});
  sb.from('crystals_taken').select('id,taken_by').then(function(r){if(r.data)r.data.forEach(function(x){takeCrystal(x.id,x.taken_by)})});
 }catch(e){say('서버 연결 실패 — 혼자 플레이합니다',3000)}
}
function netTick(now){
 if(netOK&&now-lastSend>100){lastSend=now;chan.send({type:'broadcast',event:'pos',payload:{id:myId,name:myName,x:pp.x,y:pp.y,z:pp.z,yaw:player.rotation.y}})}
 online=1;
 for(var id in remotes){var r=remotes[id];
  if(now-r.seen>4000){scene.remove(r.g);delete remotes[id];continue}
  online++;var k=Math.min(1,dt_*10);
  r.g.position.x+=(r.tx-r.g.position.x)*k;r.g.position.y+=(r.ty-r.g.position.y)*k;r.g.position.z+=(r.tz-r.g.position.z)*k;r.g.rotation.y=r.yaw}
}
var dt_=.016,bubbles=[],EMOS=['😀','❤️','👍','😂','😮'];
function showEmoji(group,e){
 for(var i=bubbles.length-1;i>=0;i--)if(bubbles[i].g===group){group.remove(bubbles[i].sp);bubbles.splice(i,1)}
 var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');g.font='96px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,70);
 var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
 sp.scale.set(1.8,1.8,1);sp.position.y=3.6;sp.renderOrder=11;group.add(sp);bubbles.push({g:group,sp:sp,t:0})}
function bubbleTick(dt){for(var i=bubbles.length-1;i>=0;i--){var b=bubbles[i];b.t+=dt;b.sp.position.y=3.6+Math.min(b.t,.4)*1.2;
 if(b.t>3){b.g.remove(b.sp);bubbles.splice(i,1)}}}

(function(){var bar=document.getElementById('emo');EMOS.forEach(function(e,i){var b=document.createElement('button');b.textContent=e;
 b.addEventListener('touchstart',function(ev){sendEmoji(e);ev.preventDefault();ev.stopPropagation()},{passive:false});
 b.addEventListener('mousedown',function(ev){sendEmoji(e);ev.stopPropagation()});bar.appendChild(b)});
 addEventListener('keydown',function(ev){var n=parseInt(ev.key,10);if(n>=1&&n<=EMOS.length)sendEmoji(EMOS[n-1])})})();
var started=false;
document.getElementById('go').onclick=function(){
 myName=(document.getElementById('nm').value||'').trim()||('모험가'+Math.floor(Math.random()*900+100));
 document.getElementById('name').style.display='none';started=true;connect();
 say('오금교 인라인스케이트장 — 수정을 모아보세요!',3000)};
renderer.render(scene,camera);
requestAnimationFrame(tick);
})();
