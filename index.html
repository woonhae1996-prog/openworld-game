<script>
(function(){
// ---------- 시드 난수 (모든 접속자가 같은 섬을 만들도록) ----------
var _seed=20261119;
function R(){_seed|=0;_seed=_seed+0x6D2B79F5|0;var t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

}

  if(h<WATER+.6)return [.78,.72,.5];

(function(){var len=BR.v1-BR.v0,cu=BR.u,cv=(BR.v0+BR.v1)/2,cx=wx(cu,cv),cz=wz(cu,cv);

box(.5,7,.5,0x555555,wx(RINK.u-RINK.L-RINK.R-6,RINK.v-9),3.5,wz(RINK.u-RINK.L-RINK.R-6,RINK.v-9));

(function(){var cu=-20,cv=-148;var cx=wx(cu,cv),cz=wz(cu,cv);

 for(var f=0;f<3;f++)box(90,2.4,.4,0x6c8fb3,wx(cu,cv+8.2),8.5+f*7,wz(cu,cv+8.2),ROT);

 for(var k=-45;k<=45;k+=8)blockers.push([wx(cu+k,cv),wz(cu+k,cv),9]);
})();
// 신정교 테니스장 펜스/네트
COURTS.forEach(function(vc){box(.15,1.1,10,0xeeeeee,wx(105,vc),.9,wz(105,vc),ROT+Math.PI/2)});
// 나무 & 돌
var trunkG=new THREE.CylinderGeometry(.25,.35,2,6),leafG=new THREE.ConeGeometry(1.6,4,7),rockG=new THREE.DodecahedronGeometry(1,0);

 if(v<-104&&v>-160&&u>-80&&u<45)return false;
 if(Math.abs(u-BR.u)<10&&v>BR.v0-6&&v<BR.v1)return false;
 if(u<RINK.u-RINK.L-RINK.R-3&&u>RINK.u-RINK.L-RINK.R-14&&Math.abs(v-RINK.v)<14)return false;

 if(b.t>3){b.g.remove(b.sp);bubbles.splice(i,1)}}}
function sendEmoji(e){showEmoji(player,e);if(netOK)chan.send({type:'broadcast',event:'emo',payload:{id:myId,e:e}})}
(function(){var bar=document.getElementById('emo');EMOS.forEach(function(e,i){var b=document.createElement('button');b.textContent=e;
 b.addEventListener('touchstart',function(ev){sendEmoji(e);ev.preventDefault();ev.stopPropagation()},{passive:false});
 b.addEventListener('mousedown',function(ev){sendEmoji(e);ev.stopPropagation()});bar.appendChild(b)});
 addEventListener('keydown',function(ev){var n=parseInt(ev.key,10);if(n>=1&&n<=EMOS.length)sendEmoji(EMOS[n-1])})})();

 myName=(document.getElementById('nm').value||'').trim()||('모험가'+Math.floor(Math.random()*900+100));
 document.getElementById('name').style.display='none';started=true;connect();
 say('오금교 인라인스케이트장 — 수정을 모아보세요!',3000)};
renderer.render(scene,camera);
requestAnimationFrame(tick);
