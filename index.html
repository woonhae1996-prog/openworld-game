<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>보드 동물 코인런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#4a2f5e;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:none;gap:8px;z-index:5}
#top button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);font-size:20px;box-shadow:0 3px 0 rgba(120,80,160,.25)}
#ctl{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));padding:0 max(16px,env(safe-area-inset-left));display:none;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
#ctl .grp{display:flex;gap:12px;pointer-events:none}
#ctl button{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9);font-size:30px;line-height:1;box-shadow:0 5px 0 rgba(120,80,160,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#ctl button small{font-size:13px;margin-top:2px}
#ctl button.on{background:rgba(255,200,230,.9);transform:translateY(3px);box-shadow:0 2px 0 rgba(120,80,160,.28)}
#ctl #cJ{width:92px;height:92px;background:rgba(255,236,150,.7)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,236,250,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:12px;overflow:auto}
.ov.hide{display:none}
.card{background:rgba(255,255,255,.9);border-radius:28px;padding:16px 22px;max-width:760px;box-shadow:0 8px 0 rgba(150,100,190,.25);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
h1{margin:0;font-size:clamp(24px,5vw,38px);font-weight:400;color:#ff6fa5;text-shadow:0 3px 0 #fff,0 5px 0 rgba(150,100,190,.25)}
.menurow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.sel{display:flex;align-items:center;gap:8px}
.sel button{width:40px;height:40px;border-radius:50%;background:#ffe3f1;font-size:16px;box-shadow:0 3px 0 #e7b3d0}
#pv{width:200px;height:170px}
#aName{font-size:24px}
#aSub,#bName,.hint{font-size:14px;opacity:.8}
.big{font-size:24px;padding:12px 34px;border-radius:999px;background:#ff8fbf;color:#fff;box-shadow:0 6px 0 #d9568d;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #d9568d}
.big.alt{background:#8fc8ff;box-shadow:0 6px 0 #4f93d6}
.stat{font-size:17px}
.res{font-size:20px;line-height:1.5}
.res b{color:#ff6fa5}
#toHub{background:none;font-size:14px;opacity:.75;text-decoration:underline;padding:4px}
.gcard{width:210px;padding:16px 12px;border-radius:24px;background:linear-gradient(#fff6c9,#ffe0f0);box-shadow:0 6px 0 rgba(150,100,190,.3);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:15px}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(150,100,190,.3)}
.gcard b{font-size:22px;font-weight:400;color:#ff6fa5}.gcard small{font-size:13px;opacity:.8}.gcard i{font-style:normal;font-size:13px;color:#8a6fb0}
.gi{font-size:46px;line-height:1.1}
@media (max-height:520px){.card{padding:10px 16px;gap:4px}#pv{width:130px;height:110px}#aName{font-size:20px}h1{font-size:22px}.big{font-size:20px;padding:8px 26px}.gcard{width:180px;padding:10px}.gi{font-size:34px}.hint{font-size:12px}.sel button{width:34px;height:34px}.res{font-size:17px}}
#rot{position:fixed;left:50%;top:8px;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:999px;padding:5px 14px;font-size:13px;display:none;z-index:6}
@media (orientation:portrait){#rot.show{display:block}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot">📱 가로로 돌리면 더 넓게 보여요</div>
<div id="top"><button id="bPause">⏸</button><button id="bMute">🔊</button></div>
<div id="ctl">
  <div class="grp"><button id="cL">◀</button><button id="cR">▶</button></div>
  <div class="grp"><button id="cT">✨<small>묘기</small></button><button id="cJ">⬆<small>점프</small></button></div>
</div>

<div id="hub" class="ov"><div class="card">
  <h1>🎮 보드 동물 놀이터</h1>
  <div class="stat">🪙 <b id="hCoins">0</b></div>
  <div class="menurow">
    <button class="gcard" id="gRun"><span class="gi">🪙</span><b>코인런</b><small>달리고 점프하고<br>코인을 모아요</small><i id="gRunBest"></i></button>
    <button class="gcard" id="gRace"><span class="gi">🏁</span><b>보드 레이스</b><small>라이벌 동물들과<br>결승선까지 경주!</small><i id="gRaceBest"></i></button>
  </div>
  <div class="hint">동물·보드·코인은 모든 게임에서 같이 써요</div>
</div></div>

<div id="menu" class="ov hide"><div class="card">
  <h1 id="mTitle">🛹 보드 동물 코인런</h1>
  <div class="menurow">
    <div class="col">
      <div class="sel"><button id="aPrev">◀</button><canvas id="pv" width="400" height="340"></canvas><button id="aNext">▶</button></div>
      <div id="aName"></div><div id="aSub"></div>
      <div class="sel"><button id="bPrev">◀</button><span id="bName"></span><button id="bNext">▶</button></div>
    </div>
    <div class="col">
      <div class="stat">🪙 <b id="tCoins">0</b> &nbsp; <span id="tBestL"></span></div>
      <button id="play" class="big">달리기!</button>
      <div class="hint" id="hint"></div><button id="toHub">← 게임 선택</button>
    </div>
  </div>
</div></div>

<div id="over" class="ov hide"><div class="card">
  <h1 id="ovT">앗! 넘어졌어요</h1>
  <div class="res" id="ovR"></div>
  <div class="menurow"><button id="again" class="big">한 번 더!</button><button id="toMenu" class="big alt">메뉴</button></div>
</div></div>

<div id="pause" class="ov hide"><div class="card">
  <h1>잠깐 휴식 ☕</h1>
  <div class="menurow"><button id="resume" class="big">계속하기</button><button id="quit" class="big alt">그만하기</button></div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const hs=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
function hex(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return`rgb(${A[0]+(B[0]-A[0])*k|0},${A[1]+(B[1]-A[1])*k|0},${A[2]+(B[2]-A[2])*k|0})`}

/* ---------- save ---------- */
let S={coins:0,best:0,wins:0,owned:['cat'],animal:'cat',board:'skate'};
try{const j=JSON.parse(localStorage.getItem('bac_v1')||'null');if(j)S=Object.assign(S,j)}catch(e){}
function save(){try{localStorage.setItem('bac_v1',JSON.stringify(S))}catch(e){}}

/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type,vol,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={
 coin:()=>{tone(988,1319,.09,'square',.035);tone(1319,1760,.1,'square',.03,.07)},
 jump:()=>tone(300,620,.16,'triangle',.07),
 dj:()=>tone(420,900,.18,'triangle',.07),
 hurt:()=>tone(300,80,.3,'sawtooth',.06),
 stomp:()=>tone(200,520,.12,'square',.05),
 land:()=>tone(170,90,.08,'sine',.08),
 trick:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.02,.1,'square',.035,i*.06)),
 power:()=>[392,523,659,784].forEach((f,i)=>tone(f,f,.12,'triangle',.07,i*.07)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.22,'triangle',.07,i*.18)),
 grind:()=>tone(1800,2400,.04,'sawtooth',.012)
};

/* ---------- data ---------- */
const ANI={
 cat:{name:'냥이',sub:'호기심 많은 고양이',price:0,body:'#ffb255',belly:'#fff1d6',dark:'#c97a24',scarf:'#ff6f91'},
 dog:{name:'멍이',sub:'꼬리 붕붕 강아지',price:60,body:'#e6b980',belly:'#fff3df',dark:'#7a5230',scarf:'#4fb6ff'},
 penguin:{name:'뒤뚱이',sub:'뒤뚱뒤뚱 펭귄',price:120,body:'#3a4d78',belly:'#ffffff',dark:'#222f4d',scarf:'#ff6f91'},
 panda:{name:'대나무',sub:'느긋한 판다',price:200,body:'#ffffff',belly:'#ffffff',dark:'#2c2c34',scarf:'#7ad06b'},
 capy:{name:'카피',sub:'세상 느긋한 카피바라',price:300,body:'#b98a5c',belly:'#d6b48a',dark:'#6d4b2c',scarf:'#ffd23f'}
};
const BOARDS={
 skate:{name:'🛹 스케이트보드',len:60,wr:5,col:'#ff6fa5'},
 long:{name:'🏄 롱보드',len:92,wr:6,col:'#5ac8fa'},
 cruiser:{name:'🍌 크루저',len:70,wr:7,col:'#ffd23f'},
 surf:{name:'🌊 서핑보드',len:96,wr:0,col:'#4de3c1'},
 snow:{name:'🏂 스노우보드',len:84,wr:0,col:'#a77bff'}
};
const BIOMES=[
 {name:'해변',sky:['#7fd3ff','#fff4dc'],far:'#a8e6dc',mid:'#6fcfbf',g:'#ffe9ae',gd:'#ecc784',acc:'#ff8fa3'},
 {name:'숲속',sky:['#94dcff','#f1ffe0'],far:'#a6dca6',mid:'#62bf79',g:'#74dc6c',gd:'#9a7048',acc:'#ffd23f'},
 {name:'설원',sky:['#b5d6ff','#f8fcff'],far:'#d9e8ff',mid:'#bcd3f5',g:'#ffffff',gd:'#c3dcf5',acc:'#7fc8ff'},
 {name:'밤도시',sky:['#2b1b66','#ff9ec7'],far:'#4d3b8e',mid:'#382b72',g:'#8a72f0',gd:'#3b2f78',acc:'#5df2ff'}
];
const BLEN=12000; // px per biome (300m)
const biomeIdx=x=>Math.max(0,Math.floor(x/BLEN))%4;

/* ---------- canvas ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let VW=800,VH=450,SC=1,DPR=1;
function resize(){
  const cw=innerWidth,ch=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  SC=Math.min(ch/450,cw/480);
  VW=cw/SC;VH=ch/SC;
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  $('rot').classList.toggle('show',ch>cw&&state!=='play');
}
addEventListener('resize',resize);

/* ---------- drawing: rider ---------- */
function blob(c,x,y,rx,ry,fill,rot){c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832);c.fill()}
function boardTop(key){const B=BOARDS[key];if(key==='surf')return -16;if(key==='snow')return -10;return -(B.wr*2+2)-4}
function drawBoard(c,key,t){
  const B=BOARDS[key],L=B.len/2;
  c.save();c.lineCap='round';c.lineJoin='round';
  if(key==='skate'||key==='long'||key==='cruiser'){
    const wr=B.wr,dy=-(wr*2+2);
    const wx=key==='skate'?L-13:key==='long'?L-18:L-14;
    for(const sx of[-wx,wx]){
      c.fillStyle='#fff';c.strokeStyle='#6b5a80';c.lineWidth=2;
      c.beginPath();c.arc(sx,-wr,wr,0,6.2832);c.fill();c.stroke();
      c.strokeStyle='#ffb3d1';c.lineWidth=1.6;c.beginPath();
      const a=t*(key==='long'?14:18)*(sx>0?1:1);
      c.moveTo(sx+Math.cos(a)*wr*.8,-wr+Math.sin(a)*wr*.8);c.lineTo(sx-Math.cos(a)*wr*.8,-wr-Math.sin(a)*wr*.8);c.stroke();
      c.fillStyle='#6b5a80';c.fillRect(sx-4,dy+2,8,3);
    }
    const lift=key==='cruiser'?7:5;
    c.beginPath();
    if(key==='cruiser'){c.moveTo(-L,dy-lift);c.quadraticCurveTo(-L+16,dy+4,0,dy+3);c.quadraticCurveTo(L-16,dy+4,L,dy-lift)}
    else{c.moveTo(-L,dy-lift);c.lineTo(-L+10,dy);c.lineTo(L-10,dy);c.lineTo(L,dy-lift)}
    c.strokeStyle='rgba(60,30,90,.45)';c.lineWidth=11;c.stroke();
    c.strokeStyle=B.col;c.lineWidth=7;c.stroke();
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.beginPath();
    if(key==='cruiser'){c.moveTo(-L+10,dy-2);c.quadraticCurveTo(0,dy+1,L-10,dy-2)}else{c.moveTo(-L+12,dy-2);c.lineTo(L-12,dy-2)}
    c.stroke();
  }else if(key==='surf'){
    c.fillStyle='rgba(60,30,90,.12)';c.beginPath();c.ellipse(0,1,L*.8,3,0,0,6.2832);c.fill();
    c.fillStyle=B.col;c.strokeStyle='rgba(60,30,90,.5)';c.lineWidth=2;
    c.beginPath();c.moveTo(-L,-11);c.quadraticCurveTo(-6,-26,L,-13);c.quadraticCurveTo(-4,-3,-L,-11);c.fill();c.stroke();
    c.strokeStyle='#fff';c.lineWidth=2.4;c.beginPath();c.moveTo(-L+10,-11);c.quadraticCurveTo(0,-15,L-14,-13);c.stroke();
    c.fillStyle='#2bb89a';c.beginPath();c.moveTo(-L+16,-6);c.lineTo(-L+8,5);c.lineTo(-L+28,-5);c.fill();
    c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<3;i++){const a=t*6+i*2;c.fillRect(-L-4-i*9,-3+Math.sin(a)*3,5,2)}
  }else{
    c.fillStyle='rgba(60,30,90,.12)';c.beginPath();c.ellipse(0,1,L*.7,3,0,0,6.2832);c.fill();
    c.strokeStyle='rgba(60,30,90,.45)';c.lineWidth=11;c.beginPath();c.moveTo(-L,-8);c.lineTo(L-14,-8);c.quadraticCurveTo(L-2,-8,L,-17);c.stroke();
    c.strokeStyle=B.col;c.lineWidth=7;c.stroke();
    c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=2;c.beginPath();c.moveTo(-L+8,-10);c.lineTo(L-18,-10);c.stroke();
    c.fillStyle='#3c2a66';c.fillRect(-16,-18,10,6);c.fillRect(8,-18,10,6);
  }
  c.restore();
}
function eye(c,x,y,r,blink,sleepy){
  if(blink){c.strokeStyle='#2c1a3a';c.lineWidth=2;c.beginPath();c.moveTo(x-r,y);c.lineTo(x+r,y);c.stroke();return}
  blob(c,x,y,r,r*(sleepy?.7:1.15),'#2c1a3a');
  c.fillStyle='#fff';c.beginPath();c.arc(x+r*.35,y-r*.45,r*.4,0,6.2832);c.fill();
  if(sleepy){c.fillStyle='rgba(0,0,0,.0)'}
}
function drawAnimal(c,k,o){
  const A=ANI[k],t=o.t||0,air=!!o.air,blink=(t%3.2)<.12;
  const bob=air?0:Math.sin(t*9)*1.3,sq=o.sq||0,sy=1-sq*.22,sx=1+sq*.14;
  c.save();c.scale(sx,sy);c.translate(0,bob);
  // scarf tail (behind)
  const fl=Math.sin(t*14)*3, sp=clamp((o.spd||200)/300,.5,1.8);
  c.fillStyle=A.scarf;c.beginPath();c.moveTo(-8,-34);c.quadraticCurveTo(-22*sp,-34+fl,-34*sp,-28+fl*2);c.lineTo(-30*sp,-36+fl*2);c.quadraticCurveTo(-18*sp,-40+fl,-6,-40);c.fill();
  // tail
  c.lineCap='round';
  if(k==='cat'){c.strokeStyle=A.body;c.lineWidth=7;c.beginPath();c.moveTo(-12,-12);c.quadraticCurveTo(-30,-14+Math.sin(t*8)*4,-26,-34);c.stroke();c.strokeStyle=A.dark;c.lineWidth=7;c.beginPath();c.moveTo(-26.5,-30);c.lineTo(-26,-34);c.stroke()}
  if(k==='dog'){c.strokeStyle=A.body;c.lineWidth=7;c.beginPath();c.moveTo(-12,-14);c.lineTo(-22,-22+Math.sin(t*20)*5);c.stroke()}
  if(k==='panda')blob(c,-14,-14,5,5,A.dark);
  if(k==='penguin'){c.fillStyle=A.dark;c.beginPath();c.moveTo(-12,-10);c.lineTo(-22,-6);c.lineTo(-12,-16);c.fill()}
  // feet
  const fc=k==='penguin'?'#ffa63d':k==='panda'?A.dark:A.dark;
  blob(c,-8,-3,7,4,fc);blob(c,9,-3,7,4,fc);
  // body
  blob(c,0,-20,15,17,A.body);
  if(k==='panda'){blob(c,0,-8,15,6,A.dark,0);blob(c,0,-20,15,17,A.body);c.fillStyle=A.dark;c.beginPath();c.ellipse(0,-9,15,7,0,0,Math.PI);c.fill()}
  blob(c,2,-18,9,11,A.belly);
  // arms
  const sw=air?-1.2+Math.sin(t*18)*.2:Math.sin(t*9)*.35;
  const ac2=k==='penguin'||k==='panda'?A.dark:A.body;
  c.save();c.translate(-12,-27);c.rotate(sw);blob(c,0,6,5,8,ac2);c.restore();
  c.save();c.translate(13,-27);c.rotate(-sw);blob(c,0,6,5,8,ac2);c.restore();
  // scarf wrap
  c.fillStyle=A.scarf;c.beginPath();c.ellipse(1,-32,13,5,0,0,6.2832);c.fill();
  // head
  const hx=2,hy=-46;
  if(k==='cat'){c.fillStyle=A.body;[-1,1].forEach(s=>{c.beginPath();c.moveTo(hx+s*17,hy-6);c.lineTo(hx+s*13,hy-30);c.lineTo(hx+s*3,hy-17);c.fill();c.fillStyle='#ffb3c4';c.beginPath();c.moveTo(hx+s*14,hy-10);c.lineTo(hx+s*12,hy-24);c.lineTo(hx+s*6,hy-16);c.fill();c.fillStyle=A.body})}
  if(k==='dog'){[-1,1].forEach(s=>{c.save();c.translate(hx+s*18,hy-8);c.rotate(s*(.25+Math.sin(t*8)*.08*(air?3:1)));blob(c,0,6,6,12,A.dark);c.restore()})}
  if(k==='panda'){[-1,1].forEach(s=>blob(c,hx+s*15,hy-14,7,7,A.dark))}
  if(k==='capy'){[-1,1].forEach(s=>blob(c,hx+s*15,hy-14,5,4.5,A.dark))}
  if(k==='capy'){blob(c,hx,hy,21,17,A.body)}else{blob(c,hx,hy,19,18,A.body)}
  if(k==='penguin'){blob(c,hx+2,hy+3,14,13,'#fff');}
  if(k==='cat'){blob(c,hx+2,hy+6,10,8,A.belly)}
  if(k==='dog'){blob(c,hx+3,hy+6,11,9,A.belly)}
  if(k==='panda'){[-1,1].forEach(s=>blob(c,hx+s*8+2,hy-1,6,7.5,A.dark,s*.4))}
  // eyes
  const ex=[-6+hx,10+hx];
  if(k==='capy'){ex.forEach(x=>{c.strokeStyle='#2c1a3a';c.lineWidth=2.2;c.beginPath();c.arc(x,hy-3,3,.15*Math.PI,.85*Math.PI);c.stroke()})}
  else ex.forEach(x=>eye(c,x,hy-2,3.3,blink));

/* ---------- world ---------- */
let segs,items,enemies,decor,parts,pops,toasts;
let genX,genY,pieceN,lastType;
function addSeg(x0,y0,x1,y1,o){segs.push(Object.assign({x0,y0,x1,y1,bi:biomeIdx(x0)},o))}
function segY(s,x){return s.y0+(s.y1-s.y0)*((x-s.x0)/((s.x1-s.x0)||1))}
function surfAt(x,yref,tol){let best=null,bd=1e9;for(const s of segs){if(x<s.x0||x>s.x1)continue;const y=segY(s,x),dd=Math.abs(y-yref);if(dd<tol&&dd<bd){bd=dd;best={y,s}}}return best}
function groundY(x){let r=null;for(const s of segs){if(s.plat||x<s.x0||x>s.x1)continue;r=segY(s,x);break}return r}
function flat(len,o){const x=genX;addSeg(x,genY,x+len,genY,o);genX+=len;return x}
function slope(len,dh,o){const x=genX;addSeg(x,genY,x+len,genY+dh,o);genX+=len;genY+=dh;return x}
function coin(x,y,k){items.push({k:k||'coin',x,y,t:rnd(0,6),got:false})}
function coinLine(x0,x1,step,off){for(let x=x0;x<=x1;x+=step){const g=groundY(x);if(g!=null)coin(x,g-off)}}
function coinArc(x0,x1,n,baseY,h){for(let i=0;i<=n;i++){const u=i/n;coin(lerp(x0,x1,u),baseY-Math.sin(u*Math.PI)*h)}}
function addDecor(x){const g=groundY(x);if(g==null)return;decor.push({x,y:g,v:Math.random()<.5?0:1,s:rnd(.85,1.2),bi:biomeIdx(x)})}
function enemyOk(x){return x>900}
function genPiece(){
  const d=clamp(genX/40/900,0,1);pieceN++;
  let type='flat';
  if(pieceN>2){
    const W=[['flat',3],['hill',2.2],['bumps',1.4],['gap',1.6+d*1.4],['rail',1.2],['kicker',1.1],['plats',1.8],['gauntlet',d>.1?.4+d*1.8:0]];
    for(let tries=0;tries<4;tries++){
      let tot=0;W.forEach(w=>tot+=w[1]);let r=Math.random()*tot;
      for(const w of W){r-=w[1];if(r<=0){type=w[0];break}}
      if(type!==lastType||type==='flat')break;
    }
  }
  lastType=type;
  const gy0=genY;
  if(type==='flat'){
    const len=rnd(320,560),x=flat(len);
    const v=Math.random();
    if(!enemyOk(x)||v<.35)coinLine(x+50,x+len-50,36,34);
    else if(v<.6){const cx=x+len/2;coinLine(x+30,cx-70,36,34);coinLine(cx+70,x+len-30,36,34);enemies.push({k:'cone',x:cx,y:genY,w:26,h:34});coinArc(cx-55,cx+55,5,genY-38,60)}
    else if(v<.82){const a=x+40,b=x+len-40;enemies.push({k:'crab',x:(a+b)/2,y:genY,w:36,h:24,min:a,max:b,dir:-1});coinLine(a,b,40,78)}
    else {for(let i=0;i<=8;i++){const xx=x+50+i*(len-100)/8;coin(xx,genY-34-Math.sin(i*.9)*26)}}
    if(Math.random()<.5)addDecor(x+rnd(10,len-10));
    if(Math.random()<.35)addDecor(x+rnd(10,len-10));
    if(Math.random()<.07)items.push({k:'heart',x:x+len*.5,y:genY-70,t:0,got:false});
    else if(Math.random()<.06)items.push({k:'mag',x:x+len*.5,y:genY-70,t:0,got:false});
    else if(Math.random()<.04)items.push({k:'boost',x:x+len*.5,y:genY-70,t:0,got:false});
  }else if(type==='hill'){
    const dh=rnd(60,105),up=(gy0-dh>=-270);const sgn=up?-1:1;
    const L1=rnd(140,200),L2=rnd(110,190),L3=rnd(140,200);
    const x0=genX;slope(L1,sgn*dh);flat(L2);slope(L3,-sgn*dh);
    coinLine(x0+30,genX-30,38,34);addDecor(x0+L1+L2/2);
    flat(rnd(160,240));
  }else if(type==='bumps'){
    const n=3+(Math.random()<.5?1:0),x0=genX,a=rnd(26,38);
    for(let i=0;i<n;i++){slope(rnd(100,120),-a);slope(rnd(100,120),a)}
    coinLine(x0+20,genX-20,34,34);flat(rnd(160,240));
  }else if(type==='gap'){
    flat(150);const L=100+d*55+rnd(0,22),gx=genX;genX+=L;
    coinArc(gx-30,gx+L+30,7,genY-34,70+d*10);
    const lx=flat(rnd(240,320));coinLine(lx+40,lx+180,40,34);
  }else if(type==='rail'){
    flat(170);const g1=44;genX+=g1;const L=rnd(220,320),rx=genX;
    addSeg(genX,genY,genX+L,genY,{rail:true});genX+=L;genX+=g1;
    coinLine(rx+10,rx+L-10,32,42);
    const lx=flat(rnd(240,300));coinLine(lx+40,lx+160,40,34);
  }else if(type==='kicker'){
    flat(150);const sx=genX;slope(80,-46,{kick:true});const L=rnd(135,160),gx=genX;genX+=L;genY+=46;
    coin(gx+L/2,gy0-150,'star');coinArc(gx-20,gx+L+30,6,gy0-70,60);
    const lx=flat(rnd(260,340));coinLine(lx+40,lx+180,40,34);
  }else if(type==='plats'){
    const len=rnd(480,620),x=flat(len);
    const n=3;
    for(let i=0;i<n;i++){
      const px=x+60+i*(len-200)/(n-1),w=rnd(110,150),py=genY-rnd(82,98)-(i===1?0:0);
      segs.push({x0:px,y0:py,x1:px+w,y1:py,plat:true,bi:biomeIdx(px)});
      coinLine2(px+14,px+w-14,32,py-32);
    }
    // high bonus plat
    const hx=x+len/2-50,hy=genY-165;
    segs.push({x0:hx,y0:hy,x1:hx+100,y1:hy,plat:true,bi:biomeIdx(hx)});
    coin(hx+50,hy-36,'star');
    coinLine(x+30,x+len-30,48,30);
  }else if(type==='gauntlet'){
    const len=620,x=flat(len);
    for(let i=0;i<3;i++){const cx=x+130+i*190;
      if(i===1&&d>.4){enemies.push({k:'crab',x:cx,y:genY,w:36,h:24,min:cx-60,max:cx+60,dir:1})}
      else enemies.push({k:'cone',x:cx,y:genY,w:26,h:34});
      coinArc(cx-52,cx+52,5,genY-40,64);}
    if(d>.3)enemies.push({k:'bird',x:x+len/2,y:genY-120,w:34,h:26,base:genY-120,t:rnd(0,6)});
  }
  if(genY<-285||genY>0){/* clamp drift */ if(genY>0){const L=120;slope(L,-genY)}}
}
function coinLine2(x0,x1,step,y){for(let x=x0;x<=x1;x+=step)coin(x,y)}
function genAhead(lim){while(genX<lim)genPiece()}
function resetWorld(){
  segs=[];items=[];enemies=[];decor=[];parts=[];pops=[];toasts=[];
  genX=-500;genY=0;pieceN=0;lastType='';
  const x=flat(1100);
  coinLine(x+500,x+1000,40,34);
  addDecor(x+300);addDecor(x+700);
}
function cull(cx){
  const lim=cx-500;
  segs=segs.filter(s=>s.x1>lim);items=items.filter(i=>i.x>lim&&!i.got);enemies=enemies.filter(e=>e.x>lim&&!e.dead);decor=decor.filter(d=>d.x>lim-100);
}

/* ---------- player ---------- */
let mode='run',rivals=[],RACE_LEN=24000,finishX=140+RACE_LEN;
let state='hub',P,cam={x:0,y:0,sh:0},runT=0,lastCull=0;
const keys={l:0,r:0,j:0};
function newPlayer(){

    inv:0,boost:0,mag:0,hp:3,coins:0,bonus:0,combo:0,comboT:0,trick:false,trickT:0,trickDone:false,air0:0,

function startRun(){

function dist(){return Math.max(0,P.x-140)/40}
function score(){return Math.floor(dist())+P.coins*5+P.bonus}
function toast(t,life){toasts.push({t,life:life||1.6,max:life||1.6})}
function pop(x,y,t,col){pops.push({x,y,t,col:col||'#fff',life:.9,max:.9})}
function puff(x,y,n,col,sp,up){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-sp,sp),vy:rnd(-sp,sp*.3)-(up||0),life:rnd(.3,.6),max:.6,col,s:rnd(2,5)})}
function doJump(v,n){P.vy=-v;P.on=false;P.coy=0;P.buf=0;P.jumps=n;P.jumpCut=true;P.rail=false;P.air0=0;
  if(n===1){SFX.jump();puff(P.x,P.y,5,'rgba(255,255,255,.8)',50,0)}else{SFX.dj();puff(P.x,P.y-10,8,'#fff',80,0)}}
function doTrick(){if(state!=='play'||P.on||P.trick||P.dead)return;P.trick=true;P.trickT=0;P.trickDone=false}
function hurt(){
  if(P.inv>0||P.boost>0||P.dead)return;
  if(mode==='race'){P.inv=1.2;P.stun=.9;P.vx=70;P.vy=-260;P.on=false;P.trick=false;P.combo=0;cam.sh=8;SFX.hurt();puff(P.x,P.y-30,10,'#ff8fa3',140,40);return}
  P.hp--;P.inv=1.7;P.stun=.6;P.vx=70;P.vy=-300;P.on=false;P.combo=0;P.trick=false;cam.sh=10;SFX.hurt();

function die(){
  if(P.dead)return;P.dead=true;P.vy=-520;P.on=false;state='dying';SFX.over();
  S.coins+=P.coins;const sc=score();const nb=sc>S.best;if(nb)S.best=sc;save();setHubStats();

    $('over').classList.remove('hide');setUI()},1100);

function collectCoin(it){
  it.got=true;
  if(it.k==='coin'||it.k==='star'){
    const v=it.k==='star'?5:1;P.coins+=v;P.combo++;P.comboT=1.3;P.bestCombo=Math.max(P.bestCombo,P.combo);
    SFX.coin();puff(it.x,it.y,it.k==='star'?12:4,'#ffe27a',it.k==='star'?140:60,0);
    if(it.k==='star')pop(it.x,it.y-20,'+5','#ffd23f');
    if(mode==='run'&&P.combo>=5&&P.combo%5===0)pop(P.x,P.y-80,'콤보 x'+P.combo,'#ff6fa5');
  }else if(it.k==='heart'){if(P.hp<5)P.hp++;SFX.power();pop(it.x,it.y-20,'♥ +1','#ff5f86')}
  else if(it.k==='mag'){P.mag=7;SFX.power();pop(it.x,it.y-20,'자석!','#ff5f5f')}
  else if(it.k==='boost'){P.boost=4;P.inv=Math.max(P.inv,4);SFX.power();pop(it.x,it.y-20,'부스터!','#5ac8fa');toast('부스터!',1.2)}
}
function updatePlay(dt){
  const d=dist();P.t+=dt;runT+=dt;
  for(const k of['inv','boost','mag','stun'])if(P[k]>0)P[k]-=dt;
  if(P.comboT>0){P.comboT-=dt;if(P.comboT<=0)P.combo=0}
  const ax=P.fin?0:keys.r-keys.l;
  const base=mode==='race'?235:210+Math.min(d,1200)*.07;
  let target=P.boost>0?540:base+ax*95;
  let slp=0;if(P.on&&P.seg&&!P.seg.plat)slp=(P.seg.y1-P.seg.y0)/((P.seg.x1-P.seg.x0)||1);
  if(P.on&&!P.rail)target+=slp*170;
  if(P.rail)target=Math.max(target,260);
  const acc=P.boost>0?900:(ax?650:380);
  P.vx+=clamp(target-P.vx,-acc*dt,acc*dt);
  P.vx=clamp(P.vx,P.stun>0?60:85,620);
  // jump
  if(P.buf>0)P.buf-=dt;
  if(P.on)P.coy=.1;else P.coy-=dt;
  if(P.buf>0){if(P.coy>0)doJump(560,1);else if(P.jumps<2)doJump(500,2)}
  if(!keys.j&&P.vy<-220&&P.jumpCut&&!P.on){P.vy=-220;P.jumpCut=false}
  // move
  const py=P.y;P.x+=P.vx*dt;
  if(P.on){
    const g=surfAt(P.x,py,32);
    if(g){P.dy=g.y-py;P.y=g.y;P.vy=0;P.seg=g.s;P.rail=!!g.s.rail;
      if(!g.s.plat&&!g.s.rail&&P.x-g.s.x0>40&&g.s.x1-P.x>70&&!g.s.kick)P.safe={x:P.x,y:P.y};
      if(P.rail){P.grindD+=P.vx*dt;if(P.grindD>46){P.grindD=0;P.coins++;P.combo++;P.comboT=1.3;SFX.grind();SFX.coin();pop(P.x+20,P.y-60,'+1','#ffe27a')}
        if(Math.random()<.7)parts.push({x:P.x-10,y:P.y,vx:rnd(-90,-20),vy:rnd(-120,-20),life:.3,max:.3,col:'#ffe27a',s:2.5})}
    }else{
      P.on=false;P.rail=false;P.vy=clamp(P.dy/dt,-700,500);P.air0=0;
      if(P.seg&&P.seg.kick&&P.vy<0){P.vy-=300;P.vx=Math.max(P.vx,250);puff(P.x,P.y,8,'#fff',80,0)}
    }
  }
  if(!P.on){
    P.air0+=dt;
    P.vy+=((keys.j&&P.vy<0)?1250:1500)*dt;P.y+=P.vy*dt;
    if(P.vy>=0){
      let cy=null,cs=null;
      for(const s of segs){if(P.x<s.x0||P.x>s.x1)continue;const y=segY(s,P.x);if(py<=y+22&&P.y>=y&&(cy==null||y<cy)){cy=y;cs=s}}
      if(cs){
        P.y=cy;P.on=true;P.seg=cs;P.rail=!!cs.rail;P.jumps=0;P.jumpCut=false;P.dy=0;
        P.sq=clamp(P.vy/700,.2,1);SFX.land();puff(P.x,P.y,6,'rgba(255,255,255,.85)',70,10);
        P.vy=0;
        if(P.trick){
          if(P.trickDone){const b=3+Math.min(5,Math.floor(P.air0*3));P.coins+=b;P.bonus+=b*10;P.tricks++;P.combo+=2;P.comboT=1.3;SFX.trick();pop(P.x,P.y-70,'멋져! +'+b,'#ff6fa5');puff(P.x,P.y-30,16,'#ffd23f',160,60)}
          else{P.vx*=.75;pop(P.x,P.y-60,'아차!','#8a6fb0')}
          P.trick=false;
        }
        if(P.rail){pop(P.x,P.y-70,'그라인드!','#5ac8fa');P.grindD=0}
      }
    }
    if(P.y>P.safe.y+380){
      SFX.hurt();cam.sh=10;
      if(mode!=='race'){P.hp--;if(P.hp<=0){die();return}}
      P.x=P.safe.x;P.y=P.safe.y;P.vx=240;P.vy=0;P.on=true;P.inv=2;P.combo=0;P.trick=false;P.seg=null;pop(P.x,P.y-70,'풍덩!','#5ac8fa');
    }
  }
  if(P.trick){P.trickT+=dt;if(P.trickT>=.55)P.trickDone=true}
  if(P.sq>0)P.sq=Math.max(0,P.sq-dt*5);
  // rotation
  let tr;
  if(P.on){tr=Math.atan2(P.seg?(P.seg.y1-P.seg.y0):0,P.seg?(P.seg.x1-P.seg.x0):1);if(P.seg&&P.seg.plat)tr=0}
  else tr=clamp(P.vy*.0006,-.45,.55);
  P.rot+=(tr-P.rot)*Math.min(1,dt*14);
  // items
  const mag=P.mag>0||P.boost>0;
  for(const it of items){
    if(it.got)continue;
    const cy=P.y-28,dx=it.x-P.x,dy=it.y-cy;
    if(mag&&(it.k==='coin'||it.k==='star')&&Math.abs(dx)<190&&Math.abs(dy)<190){const dd=Math.hypot(dx,dy)||1;const sp=620*dt;it.x-=dx/dd*Math.min(sp,dd);it.y-=dy/dd*Math.min(sp,dd)}
    if(dx*dx+dy*dy<(it.k==='star'?34:26)**2)collectCoin(it);
  }
  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    if(e.k==='crab'){e.x+=e.dir*45*dt;if(e.x<e.min){e.x=e.min;e.dir=1}if(e.x>e.max){e.x=e.max;e.dir=-1}}
    if(e.k==='bird'){e.t+=dt;e.x-=50*dt;e.y=e.base+Math.sin(e.t*2.4)*28}
    const ey=e.k==='bird'?e.y+e.h/2:e.y; // feet
    const ex0=e.x-e.w/2,ex1=e.x+e.w/2,ey0=ey-e.h,ey1=ey;
    const bx0=P.x-13,bx1=P.x+13,by0=P.y-52,by1=P.y-2;
    if(bx1>ex0&&bx0<ex1&&by1>ey0&&by0<ey1){
      if(P.boost>0){e.dead=true;puff(e.x,ey-10,10,'#fff',140,40);P.coins+=2;pop(e.x,ey-30,'+2','#ffd23f');SFX.stomp;continue}
      if(e.k!=='cone'&&P.vy>60&&P.y-2<=ey0+20){

function makeRivals(){
  const pool=AK.filter(a=>a!==S.animal).sort(()=>Math.random()-.5).slice(0,3);
  const nm=['라이벌 A','라이벌 B','라이벌 C'];
  return pool.map((a,i)=>({animal:a,board:BK[Math.floor(Math.random()*BK.length)],name:ANI[a].name,x:140-26*(i+1),y:0,ly:0,spd:250,t:rnd(0,9),fin:false,air:false,rot:0,ph:rnd(0,6)}));
}
function place(){let n=1;for(const r of rivals)if(r.x>P.x)n++;return n}
function updateRivals(dt){
  for(const r of rivals){
    r.t+=dt;
    let sp=r.fin?160:258+clamp((P.x-r.x)*.1,-38,48)+Math.sin(runT*.7+r.ph)*14;
    r.spd=sp;r.x+=sp*dt;
    const g=groundY(r.x);
    if(g!=null){r.ly=g;if(r.air&&runT>0)r.y=lerp(r.y,g,Math.min(1,dt*14));else r.y=g;r.air=false;
      const g2=groundY(r.x+10),g1=groundY(r.x-10);r.rot=(g2!=null&&g1!=null)?Math.atan2(g2-g1,20):0}
    else{r.air=true;r.y=lerp(r.y,r.ly-42,Math.min(1,dt*5));r.rot=.1}
    if(!r.fin&&r.x>=finishX)r.fin=true;
  }
}
function finishRace(){
  P.fin=true;const pl=place();const reward=[60,35,20,8][pl-1]||5;
  const tm=runT;S.coins+=P.coins+reward;if(pl===1)S.wins++;save();setHubStats();SFX.power();toast(pl+'등!',2.5);puff(P.x,P.y-40,30,'#ffd23f',220,120);

    $('ovR').innerHTML=`⏱ 기록 <b>${tm.toFixed(1)}</b>초<br>🪙 코인 <b>${P.coins}</b> + 순위 보상 <b>${reward}</b><br>✨ 묘기 <b>${P.tricks}</b>번`;

function updateDying(dt){

function stepAll(dt){
  genAhead(cam.x+VW+900);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);

  c.save();c.translate(x,y);
  c.fillStyle='#5b4a7a';c.fillRect(-70,-150,8,150);c.fillRect(62,-150,8,150);
  const cs=14;for(let i=0;i<10;i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#2c1a3a':'#fff';c.fillRect(-70+i*14,-160+j*cs,14,cs)}
  txt(c,'FINISH',0,-178,20,'#fff','center');
  c.fillStyle='rgba(255,255,255,.55)';for(let j=0;j<8;j++){c.fillRect(-4,-j*0,0,0)}
  c.restore();
}
function drawPlayer(c){
  const [x,y]=W2S(P.x,P.y);
  const blinkOff=P.inv>0&&P.boost<=0&&Math.floor(P.t*16)%2===0&&state==='play';
  if(blinkOff)return;
  c.save();c.translate(x,y);
  if(P.on){c.fillStyle='rgba(60,30,90,.15)';c.beginPath();c.ellipse(0,2,30,4,0,0,6.2832);c.fill()}
  c.rotate(P.rot);
  if(P.trick){const u=clamp(P.trickT/.55,0,1),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;c.translate(0,-30);c.rotate(-e*Math.PI*2);c.translate(0,30)}
  if(P.boost>0){c.fillStyle='rgba(90,200,255,.25)';c.beginPath();c.arc(0,-30,52+Math.sin(P.t*20)*3,0,6.2832);c.fill()}
  drawRider(c,S.animal,S.board,{t:P.t,air:!P.on,sq:P.sq,spd:P.vx});
  c.restore();
}
function txt(c,s,x,y,size,col,align){
  c.font=`${size}px Jua,'Noto Sans KR','Apple SD Gothic Neo',sans-serif`;c.textAlign=align||'left';c.textBaseline='middle';
  c.lineWidth=Math.max(3,size/5);c.strokeStyle='rgba(120,70,160,.85)';c.lineJoin='round';c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y);
}
function drawRaceHUD(c){
  const m=14,pl=place(),N=rivals.length+1;
  txt(c,pl+'등',m+4,m+20,36,pl===1?'#ffd23f':'#fff');
  txt(c,'/ '+N,m+68,m+26,18,'#ffe9f5');
  c.fillStyle='#ffd23f';c.strokeStyle='#d99a0b';c.lineWidth=2;c.beginPath();c.arc(m+12,m+62,10,0,6.2832);c.fill();c.stroke();
  txt(c,'x '+P.coins,m+28,m+63,22,'#fff');
  const bx=VW*.22,bw=VW*.56,by=m+16;
  c.fillStyle='rgba(255,255,255,.7)';c.fillRect(bx,by-3,bw,6);
  const pr=x=>bx+clamp((x-140)/RACE_LEN,0,1)*bw;
  for(const r of rivals){c.fillStyle=ANI[r.animal].scarf;c.beginPath();c.arc(pr(r.x),by,6,0,6.2832);c.fill()}
  c.fillStyle='#ff6fa5';c.strokeStyle='#fff';c.lineWidth=2.5;c.beginPath();c.arc(pr(P.x),by,8,0,6.2832);c.fill();c.stroke();
  txt(c,'🏁',bx+bw+14,by,18,'#fff','center');
  txt(c,Math.max(0,Math.floor((finishX-P.x)/40))+'m 남음',VW/2,m+44,15,'#fff','center');
  if(P.boost>0){c.fillStyle='rgba(90,200,255,.9)';c.fillRect(VW/2-50,m+62,100*P.boost/4,6)}
}
function drawHUD(c){
  if(mode==='race'){drawRaceHUD(c);return}
  const m=14;
  for(let i=0;i<Math.max(3,P.hp);i++){heart(c,m+14+i*28,m+16,12,i<P.hp?'#ff5f86':'rgba(255,255,255,.55)')}
  // coin icon
  c.fillStyle='#ffd23f';c.strokeStyle='#d99a0b';c.lineWidth=2;c.beginPath();c.arc(m+12,m+50,10,0,6.2832);c.fill();c.stroke();
  txt(c,'x '+P.coins,m+28,m+51,24,'#fff');
  if(P.combo>=3)txt(c,'콤보 x'+P.combo,m+6,m+82,20,'#ffd23f');
  txt(c,Math.floor(dist())+'m',VW/2,m+18,28,'#fff','center');
  txt(c,'점수 '+score(),VW/2,m+46,17,'#ffe9f5','center');
  if(P.boost>0){c.fillStyle='rgba(90,200,255,.9)';c.fillRect(VW/2-50,m+64,100*P.boost/4,6)}
  if(P.mag>0){c.fillStyle='rgba(255,95,95,.9)';c.fillRect(VW/2-50,m+72,100*P.mag/7,6)}
}
function render(c){
  c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  anchorY=VH*(VH>600?.6:.64);
  const sh=cam.sh>0?cam.sh:0;
  c.save();if(sh)c.translate(rnd(-sh,sh)*.4,rnd(-sh,sh)*.4);
  drawBG(c);
  for(const d of decor)drawDecor(c,d);
  drawSegs(c);
  const t=performance.now()/1000;
  for(const it of items)if(!it.got)drawCoin(c,it,t);
  for(const e of enemies)if(!e.dead)drawEnemy(c,e,t);
  if(mode==='race'&&(state!=='menu'&&state!=='hub')){drawFinish(c);for(const r of rivals)drawRival(c,r)}
  if((state==='play'||state==='dying'||state==='pause'||state==='over')&&P)drawPlayer(c);
  for(const p of parts){const[x,y]=W2S(p.x,p.y);c.globalAlpha=clamp(p.life/p.max,0,1);c.fillStyle=p.col;c.beginPath();c.arc(x,y,p.s,0,6.2832);c.fill()}
  c.globalAlpha=1;
  for(const p of pops){const[x,y]=W2S(p.x,p.y);c.globalAlpha=clamp(p.life/.3,0,1);txt(c,p.t,x,y,22,p.col,'center')}
  c.globalAlpha=1;
  c.restore();
  if(state==='play'||state==='dying'||state==='pause'||state==='over'){
    drawHUD(c);
    const tt=toasts[toasts.length-1];if(tt){c.globalAlpha=clamp(tt.life/.4,0,1);txt(c,tt.t,VW/2,VH*.3,40,'#fff','center');c.globalAlpha=1}
  }
}

/* ---------- menu ---------- */
const pvc=$('pv').getContext('2d');
const AK=Object.keys(ANI),BK=Object.keys(BOARDS);
function setHubStats(){
  $('hCoins').textContent=S.coins;$('gRunBest').textContent=S.best?'🏆 최고 '+S.best+'점':'';$('gRaceBest').textContent=S.wins?'🥇 우승 '+S.wins+'회':'';
}
function openMenu(){
  state='menu';$('hub').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('menu').classList.remove('hide');
  $('mTitle').textContent=mode==='race'?'🏁 보드 레이스':'🛹 보드 동물 코인런';
  resetWorld();cam.x=0;cam.y=0;setUI();
}
function showHub(){
  state='hub';$('menu').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('hub').classList.remove('hide');
  resetWorld();cam.x=0;cam.y=0;setHubStats();setUI();
}
$('gRun').onclick=()=>{ac();mode='run';openMenu()};
$('gRace').onclick=()=>{ac();mode='race';openMenu()};
$('toHub').onclick=showHub;
function refreshMenu(){
  const a=ANI[S.animal],own=S.owned.includes(S.animal);
  $('aName').textContent=a.name+(own?'':' 🔒');$('aSub').textContent=a.sub;
  $('bName').textContent=BOARDS[S.board].name;
  $('tCoins').textContent=S.coins;$('tBestL').innerHTML=mode==='race'?'🥇 우승 <b>'+S.wins+'</b>회':'🏆 최고 <b>'+S.best+'</b>점';
  $('hint').innerHTML=mode==='race'?(touch?'◀▶ 속도 조절이 중요해요! · ⬆ 점프 · ✨ 묘기<br>600m 결승선을 1등으로!':'→ 로 속도 올리기 · Space 점프 · ↓/Z 묘기<br>600m 결승선을 1등으로!'):(touch?'◀▶ 속도 조절 · ⬆ 점프(두 번 누르면 2단) · ✨ 공중에서 묘기!<br>코인을 모으고 적은 밟아요':'← → 속도 · Space 점프(2단) · ↓ / Z 공중 묘기 · P 일시정지<br>코인을 모으고 적은 밟아요');
  $('play').textContent=own?'🛹 달리기!':`🔒 ${a.price}🪙로 열기`;
  $('play').classList.toggle('alt',!own);
}
function setUI(){
  const playing=state==='play';
  $('top').style.display=(state==='play'||state==='pause')?'flex':'none';
  $('ctl').style.display=(touch&&(state==='play'||state==='pause'))?'flex':'none';
  $('rot').classList.toggle('show',innerHeight>innerWidth&&state!=='play');
  refreshMenu();
}
$('aPrev').onclick=()=>{S.animal=AK[(AK.indexOf(S.animal)+AK.length-1)%AK.length];save();refreshMenu()};
$('aNext').onclick=()=>{S.animal=AK[(AK.indexOf(S.animal)+1)%AK.length];save();refreshMenu()};
$('bPrev').onclick=()=>{S.board=BK[(BK.indexOf(S.board)+BK.length-1)%BK.length];save();refreshMenu()};
$('bNext').onclick=()=>{S.board=BK[(BK.indexOf(S.board)+1)%BK.length];save();refreshMenu()};
$('play').onclick=()=>{
  ac();const a=ANI[S.animal];
  if(!S.owned.includes(S.animal)){
    if(S.coins>=a.price){S.coins-=a.price;S.owned.push(S.animal);save();SFX.power();refreshMenu()}
    else{$('hint').textContent=`코인이 모자라요 (${S.coins}/${a.price}) — 달려서 모아봐요!`}
    return;
  }
  startRun();
};
$('again').onclick=()=>{ac();startRun()};
$('toMenu').onclick=toMenu;
function toMenu(){openMenu()}
function pause(){if(state!=='play')return;state='pause';$('pause').classList.remove('hide');setUI()}
function resume(){if(state!=='pause')return;state='play';$('pause').classList.add('hide');setUI()}
$('resume').onclick=resume;
$('quit').onclick=()=>{S.coins+=P.coins;if(mode==='run'){const sc=score();if(sc>S.best)S.best=sc}save();setHubStats();toMenu()};
$('bPause').onclick=pause;
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- input ---------- */
const touch=(()=>{try{return/[?&]touch=1/.test(location.search)||matchMedia('(pointer:coarse)').matches||('ontouchstart' in window)}catch(e){return false}})();
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{
  if(e.repeat&&(e.code==='Space'||e.code==='ArrowUp'))return;
  if(KM[e.code]){keys[KM[e.code]]=1;e.preventDefault()}
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(state==='menu'&&!$('menu').classList.contains('hide')){}else if(state==='play'){keys.j=1;P.buf=.12}else if(state==='over')startRun()}
  if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='KeyZ'||e.code==='ShiftLeft'||e.code==='KeyX'){e.preventDefault();doTrick()}
  if(e.code==='KeyP'||e.code==='Escape'){state==='pause'?resume():pause()}
  if(e.code==='Enter'&&state==='menu')$('play').click();
});
addEventListener('keyup',e=>{
  if(KM[e.code])keys[KM[e.code]]=0;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.j=0;
});
function bindBtn(id,down,up){const b=$(id);
  const d=e=>{e.preventDefault();ac();b.classList.add('on');down()},u=e=>{e.preventDefault();b.classList.remove('on');up&&up()};
  b.addEventListener('pointerdown',d);b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
  b.addEventListener('contextmenu',e=>e.preventDefault());}
bindBtn('cL',()=>keys.l=1,()=>keys.l=0);
bindBtn('cR',()=>keys.r=1,()=>keys.r=0);
bindBtn('cJ',()=>{if(state==='play'){keys.j=1;P.buf=.12}},()=>keys.j=0);
bindBtn('cT',()=>doTrick(),null);

/* ---------- loop ---------- */
let last=performance.now(),menuT=0;
function frame(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){updatePlay(dt);stepAll(dt)}
  else if(state==='dying'){updateDying(dt);stepAll(dt)}
  else if(state==='menu'||state==='hub'){cam.x+=70*dt;cam.y=-20;menuT+=dt;stepAll(dt)}
  else if(state==='over'){stepAll(dt*.2)}
  render(ctx);
  if(state==='menu'){
    pvc.setTransform(1,0,0,1,0,0);pvc.clearRect(0,0,400,340);
    pvc.save();pvc.translate(200,285);pvc.scale(2.6,2.6);
    pvc.fillStyle='rgba(120,70,160,.15)';pvc.beginPath();pvc.ellipse(0,3,44,5,0,0,6.2832);pvc.fill();
    pvc.translate(0,Math.sin(menuT*3)*-2);drawRider(pvc,S.animal,S.board,{t:menuT,air:false,sq:0,spd:260});pvc.restore();
    if(!S.owned.includes(S.animal)){pvc.fillStyle='rgba(255,255,255,.35)';pvc.fillRect(0,0,400,340)}
  }
  requestAnimationFrame(frame);
}
window.__dbg={setMode:m=>{mode=m},get rivals(){return rivals},get P(){return P},get state(){return state},get segs(){return segs},get enemies(){return enemies},get items(){return items},keys,startRun,get cam(){return cam},S,die,setBoard:b=>{S.board=b},setAnimal:a=>{S.animal=a},doTrick,jump:()=>{keys.j=1;P.buf=.12;setTimeout(()=>keys.j=0,120)}};
resize();showHub();requestAnimationFrame(frame);
})();
</script>
</body>
