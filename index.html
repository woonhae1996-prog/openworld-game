#joy{position:fixed;left:24px;bottom:40px;width:120px;height:120px;border-radius:50%;background:#fff3;border:2px solid #fff6;display:none}

<script>
(function(){
// ---------- 시드 난수 (모든 접속자가 같은 섬을 만들도록) ----------
var _seed=20261119;
function R(){_seed|=0;_seed=_seed+0x6D2B79F5|0;var t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

function hash(x,y){var s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
 var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 var a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);

var SIZE=400,HALF=SIZE/2,WATER=-1.5;
// ---- 리미널 월드: 콘크리트 아치 벽 + 반사 풀 + 잔잔한 호수 + 풀 언덕 ----
var PLAZA={x0:-92,x1:62,z0:-30,z1:42,h:1.0};
var POOL={x0:-25,x1:25,z0:-24,z1:-6};
var TUN={x:78,z:0,hx:15,hz:15};
function inRect(x,z,r){return x>=r.x0&&x<=r.x1&&z>=r.z0&&z<=r.z1}
function rectDist(x,z,r){var dx=Math.max(r.x0-x,0,x-r.x1),dz=Math.max(r.z0-z,0,z-r.z1);return Math.sqrt(dx*dx+dz*dz)}

function onTunPad(x,z){return Math.abs(x-TUN.x)<=TUN.hx&&Math.abs(z-TUN.z)<=TUN.hz}
function roadX(z){var t=Math.max(0,Math.min(1,(z+160)/300));return 135+38*Math.sin(t*9.4)}
function roadH(z){var t=Math.max(0,Math.min(1,(z+160)/300));return 1+34*(1-t)}

var MTN={x:-135,z:105,r:95,h:58},CRU={x:10,z:118,r:48};
function skateD(x,z){var dh=0;
 var px=Math.abs(x-32),pz=Math.abs(z-24);if(px<8&&pz<8)dh=Math.max(dh,Math.min(1.4,(8-Math.max(px,pz))*.55));
 var bd=Math.hypot(x-8,z-26);if(bd<9)dh=Math.min(dh,-2.2*(1-(bd/9)*(bd/9)));
 if(x>47&&x<60&&z>10&&z<36){var t=(x-47)/13;dh=Math.max(dh,5*t*t*t)}

function height(x,z){
 var h=(fbm(x*.011+3,z*.011+3)-.5)*22+5.5;if(h<1)h=1+(h-1)*.15;
 var dm=Math.hypot(x-MTN.x,z-MTN.z);h+=MTN.h*Math.pow(Math.max(0,1-dm/MTN.r),1.4);
 var e=(x/130)*(x/130)+((z+125)/62)*((z+125)/62);
 h=mixv(h,-4.5,sst(1.15,.6,e));
 var ex=Math.max(Math.abs(x),Math.abs(z))-150;if(ex>0)h+=ex*ex*.012;
 var dc=Math.hypot(x-CRU.x,z-CRU.z);h=mixv(1.0,h,sst(CRU.r,CRU.r+12,dc));
 var rw=roadW(z);if(rw>0){var d=Math.abs(x-roadX(z));h=mixv(h,mixv(roadH(z),h,sst(6,16,d)),rw)}
 h=mixv(PLAZA.h,h,sst(0,12,rectDist(x,z,PLAZA)));
 if(inRect(x,z,PLAZA))h+=skateD(x,z);
 var d2=Math.hypot(Math.max(Math.abs(x-TUN.x)-TUN.hx,0),Math.max(Math.abs(z-TUN.z)-TUN.hz,0));
 h=mixv(1.0,h,sst(0,10,d2));
 if(x>POOL.x0&&x<POOL.x1&&z>POOL.z0&&z<POOL.z1)h=0;
 return h;
}
function ground(x,z,y){return height(x,z)}
function surfaceColor(x,z){return dtint(surfaceColor0(x,z))}
function dtint(c){return [c[0]*.68+.256,c[1]*.68+.262,c[2]*.68+.282]}
function isPaved(x,z){if(inRect(x,z,PLAZA)||onTunPad(x,z))return true;
 if(roadW(z)>.5&&Math.abs(x-roadX(z))<6)return true;
 var dc=Math.hypot(x-CRU.x,z-CRU.z);return dc<CRU.r&&Math.abs(dc-34)<3.6}
function surfType(x,z,h){if(h<WATER)return 'water';
 var dm=Math.hypot(x-MTN.x,z-MTN.z);if(dm<MTN.r+2&&sst(10,18,h)>.5)return 'snow';

function surfaceColor0(x,z){

 if(Math.abs(z+30)<1.3&&Math.abs(x)<45&&Math.abs(x)>8)return [.55,.56,.62];
 if(x>POOL.x0&&x<POOL.x1&&z>POOL.z0&&z<POOL.z1)return [.2,.3,.62];

 if(rw>.5){var dd=Math.abs(x-roadX(z));if(dd<6){if(dd>5.2)return [.95,.95,.95];if(dd<.18&&(Math.floor(z/5)&1))return [.95,.8,.2];return [.26,.26,.3]}}
 var dc=Math.hypot(x-CRU.x,z-CRU.z);
 if(dc<CRU.r){var rr=Math.abs(dc-34);if(rr<3.6){if(rr>3.0)return [.95,.95,.95];return [.5,.51,.57]}}
 if(inRect(x,z,PLAZA)||onTunPad(x,z)){
  if(inRect(x,z,PLAZA)){
   if(Math.hypot(x-8,z-26)<9.3)return [.6,.63,.76];
   if(Math.abs(x-32)<8&&Math.abs(z-24)<8)return [.92,.88,.7];
   if(x>47&&x<60&&z>10&&z<36)return [.74,.77,.88];
   if(x>20&&x<30&&z>8&&z<14)return [.9,.78,.62];
  }
  var ln=(Math.abs(x%6)<.14||Math.abs(z%6)<.14);return ln?[.66,.68,.76]:[.84+n*.3,.86+n*.3,.9]}

 if(h<WATER+1.7)return [.88,.82,.66];
 var t=Math.min(1,Math.max(0,(h-2)/12));

 if(dm<MTN.r+2){var st=sst(10,18,h);return [mixv(g[0],.93+n,st),mixv(g[1],.96+n,st),mixv(g[2],1,st)]}

// ---------- 씬 ----------
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xe6cbd0);

document.body.prepend(renderer.domElement);

var sun=new THREE.DirectionalLight(0xffe0c8,.75);sun.position.set(-80,70,-120);scene.add(sun);
// 지형
var seg=300,geo=new THREE.PlaneGeometry(SIZE,SIZE,seg,seg);geo.rotateX(-Math.PI/2);
var pos=geo.attributes.position,col=new Float32Array(pos.count*3);
for(var i=0;i<pos.count;i++){
 var x=pos.getX(i),z=pos.getZ(i);pos.setY(i,height(x,z));
 var c=surfaceColor(x,z);col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
}
geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true})));
var water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE,100,100).rotateX(-Math.PI/2),
 new THREE.MeshLambertMaterial({color:0x9db8dc,transparent:true,opacity:.88}));
water.position.y=0;scene.add(water);
function waveAmp(x,z){var e=(x/130)*(x/130)+((z+125)/62)*((z+125)/62);return .35+.65*(1-sst(.9,1.6,e))}
function waveY(x,z,t){return WATER+waveAmp(x,z)*(1.3*Math.sin(z*.1-t*1.6)+.5*Math.sin(x*.07+z*.05-t*1.1))}
var wPos=water.geometry.attributes.position,wBase=[];for(var i=0;i<wPos.count;i++)wBase.push(wPos.getX(i),wPos.getZ(i));
function waveUpdate(t){for(var i=0;i<wPos.count;i++){var x=wBase[i*2],z=wBase[i*2+1];wPos.setY(i,waveY(x,z,t))}wPos.needsUpdate=true}
waveUpdate(0);
var poolWater=new THREE.Mesh(new THREE.PlaneGeometry(POOL.x1-POOL.x0,POOL.z1-POOL.z0).rotateX(-Math.PI/2),
 new THREE.MeshLambertMaterial({color:0x5878c4,transparent:true,opacity:.82}));
poolWater.position.set((POOL.x0+POOL.x1)/2,.55,(POOL.z0+POOL.z1)/2);scene.add(poolWater);
var blockers=[];
function tcol(color){var cc=new THREE.Color(color),tt=dtint([cc.r,cc.g,cc.b]);cc.setRGB(tt[0],tt[1],tt[2]);return cc}
function box(w,h,d,color,cx,cy,cz,rot){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:tcol(color)}));m.position.set(cx,cy,cz);if(rot)m.rotation.y=rot;scene.add(m);return m}

function sign(text,w,h,x,y,z,bg){var c=document.createElement('canvas');c.width=512;c.height=128;var g=c.getContext('2d');
 g.fillStyle=bg||'#1b5fa8';g.fillRect(0,0,512,128);g.strokeStyle='#fff';g.lineWidth=6;g.strokeRect(4,4,504,120);
 g.fillStyle='#fff';g.font='bold 46px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,66);
 var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide}));
 m.position.set(x,y,z);scene.add(m);return m}
// 아치 형태 (구멍 뚫린 압출 모양)
function archPath(cx,y0,w,h){var p=new THREE.Path(),r=w/2;p.moveTo(cx-r,y0);p.lineTo(cx-r,y0+h-r);p.absarc(cx,y0+h-r,r,Math.PI,0,true);p.lineTo(cx+r,y0);p.lineTo(cx-r,y0);return p}
function concrete(color){return new THREE.MeshLambertMaterial({color:tcol(color)})}
// 큰 아치 벽 (z=-30)
(function(){var sh=new THREE.Shape();sh.moveTo(-45,-3);sh.lineTo(45,-3);sh.lineTo(45,28);sh.lineTo(-45,28);sh.lineTo(-45,-3);
 sh.holes.push(archPath(0,.95,16,21));sh.holes.push(archPath(-28,8,7,13));sh.holes.push(archPath(28,8,7,13));
 var ge=new THREE.ExtrudeGeometry(sh,{depth:2.4,bevelEnabled:false});ge.translate(0,0,-1.2);
 var m=new THREE.Mesh(ge,concrete(0xd6d9e4));m.position.set(0,0,-30);scene.add(m);
 for(var x=-45;x<=45;x+=3){if(Math.abs(x)<10.5)continue;blockers.push([x,-30,2.1])}})();
// 터널 (z 방향으로 통과)
(function(){var w=18,h=14,t=3,dp=20,sh=new THREE.Shape(),r=w/2;
 sh.moveTo(-r,-1);sh.lineTo(r,-1);sh.lineTo(r,h-r);sh.absarc(0,h-r,r,0,Math.PI,false);sh.lineTo(-r,-1);
 sh.holes.push(archPath(0,0,w-2*t,h-t));
 var ge=new THREE.ExtrudeGeometry(sh,{depth:dp,bevelEnabled:false});ge.translate(0,0,-dp/2);
 var m=new THREE.Mesh(ge,concrete(0xdcdfe8));m.position.set(TUN.x,1.0,TUN.z);scene.add(m);
 for(var z=-10;z<=10;z+=3){blockers.push([TUN.x-7.6,z,2.2]);blockers.push([TUN.x+7.6,z,2.2])}
 var chrome=new THREE.MeshPhongMaterial({color:0xc9d0da,specular:0xffffff,shininess:120});
 [-4.6,4.6].forEach(function(o){var b=new THREE.Mesh(new THREE.BoxGeometry(1,.14,4.6),chrome);b.position.set(TUN.x+o,2.5,0);scene.add(b);
  [-1.8,1.8].forEach(function(zz){var l=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1.5,8),chrome);l.position.set(TUN.x+o,1.75,zz);scene.add(l)})})})();
// 풀 가장자리 사다리
[-13,-11].forEach(function(z){pb(-25.3,1.9,z,.12,1.8,.12,0xe8edf5)});[1.2,.7,.2].forEach(function(y){pb(-25.3,y+.9,-12,.1,.1,2,0xe8edf5)});

function palm(x,z,base,hgt){var g=new THREE.Group(),tm=new THREE.MeshLambertMaterial({color:0xa5896a}),n=10;
 for(var i=0;i<n;i++){var sg=new THREE.Mesh(new THREE.CylinderGeometry(.36-.016*i,.41-.016*i,hgt/n+.1,6),tm);sg.position.set(Math.sin(i*.12)*i*.25,(i+.5)*hgt/n,0);g.add(sg)}

 g.position.set(x,base,z);scene.add(g);return g}

// 고무오리

 var b=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),ym);b.scale.set(1.2,.9,1);g.add(b);

  if(ok){pp.x=nx;pp.z=nz}
  pp.yaw=Math.atan2(dx,dz);
 }
 // 점프 & 중력
 var gh=ground0(pp.x,pp.z);
 if((keys.Space||jumpReq)&&pp.onGround){pp.vy=board?BOARDS[board].jump:8;pp.onGround=false}
 jumpReq=false;
 pp.vy-=22*dt;pp.y+=pp.vy*dt;
 var spd=Math.hypot(pp.vx,pp.vz);if(pp.y<=gh){pp.y=gh;pp.vy=0;pp.onGround=true}else if(board&&pp.onGround&&pp.vy<=.1&&pp.y-gh<Math.max(.45,spd*.045)){pp.y=gh;pp.vy=0}else if(pp.y-gh>.15)pp.onGround=false;
 player.position.set(pp.x,pp.y,pp.z);
 if(board)pp.yaw=pp.h;
 player.rotation.y+= (pp.yaw-player.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI;
 if(board&&!drag){var tg=pp.h+Math.PI;camYaw+=(((tg-camYaw+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*2.5)}
 body.position.y=board?.95:(.8+(il>.05&&pp.onGround?Math.abs(Math.sin(time*10))*.12:0));
 // 수정
 crystals.forEach(function(c,i){if(!c.visible)return;c.rotation.y=time*2+i;c.position.y=c.userData.base+1.5+Math.sin(time*2+i)*.25;
  var dx=c.position.x-pp.x,dz=c.position.z-pp.z;
  if(started&&dx*dx+dz*dz<2.5&&Math.abs(c.position.y-pp.y-1)<2.5){takeCrystal(i,myId);if(sb)sb.from('crystals_taken').insert({id:i,taken_by:myId}).then(function(){});
   if(takenCount()>=TOTAL&&!done){done=true;say('🎉 모든 수정을 함께 모았어요!',6000)}}});
 // 카메라
 var dist=9,cx=pp.x+Math.sin(camYaw)*Math.cos(camPitch)*dist,cz=pp.z+Math.cos(camYaw)*Math.cos(camPitch)*dist,cyy=pp.y+2+Math.sin(camPitch)*dist;
 cyy=Math.max(cyy,height(cx,cz)+1);
 camera.position.set(cx,cyy,cz);camera.lookAt(pp.x,pp.y+1.5,pp.z);
 waveUpdate(time);dream(time);
 hud.innerHTML='💎 내 '+score+' · 전체 '+takenCount()+'/'+TOTAL+'<br>👥 접속 '+online+'명<br>고도 '+Math.round(pp.y)+'m'+(inWater?' · 수영 중':'');
 drawMini();
 renderer.render(scene,camera);
 requestAnimationFrame(tick);
}
