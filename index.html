<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>보드 동물 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
<style>
:root{--card:#2b1b36;--line:#150c1c;--acc:#ff7a45;--gold:#ffd36b;--txt:#fff1de;--bd:#7a5a96}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1226;font-family:'NeoDunggeunmo','Galmuri11','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',monospace;color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
canvas#t{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:0}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:none;gap:8px;z-index:5}
#top button{width:44px;height:44px;background:#4a3260;border:3px solid var(--line);font-size:18px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2)}
#ctl{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));padding:0 max(16px,env(safe-area-inset-left));display:none;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
#ctl .grp{display:flex;gap:12px;pointer-events:none}
#ctl button{pointer-events:auto;width:74px;height:74px;background:rgba(43,27,54,.72);border:4px solid var(--line);font-size:28px;line-height:1;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;color:#fff}
#ctl button small{font-size:13px;margin-top:2px}
#ctl button.on{background:rgba(255,122,69,.9);transform:translateY(3px)}
#ctl #cJ{width:90px;height:90px;background:rgba(255,160,60,.55)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,9,26,.72);z-index:10;padding:12px;overflow:auto}
.ov.hide{display:none}
.card{background:var(--card);border:4px solid var(--bd);box-shadow:0 0 0 4px var(--line),0 10px 0 4px var(--line);padding:16px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:760px;text-align:center}
h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:400;color:var(--gold);text-shadow:3px 3px 0 var(--line)}
.menurow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.sel{display:flex;align-items:center;gap:8px}
.sel button{width:40px;height:40px;background:#4a3260;border:3px solid var(--line);font-size:16px;color:#fff;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2)}
#pv{width:200px;height:170px;image-rendering:pixelated}
#aName{font-size:24px;color:var(--gold)}
#aSub,#bName,.hint{font-size:15px;opacity:1;line-height:1.5}
.big{font-size:22px;padding:12px 30px;background:var(--acc);color:#fff;border:4px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.35);text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.big:active{transform:translateY(3px)}
.big.alt{background:#5a7be8}
.stat{font-size:17px}
.res{font-size:19px;line-height:1.6}
.res b{color:var(--gold)}
#toHub{background:none;font-size:15px;opacity:1;text-decoration:underline;padding:4px}
.gcard{width:215px;padding:16px 12px;background:#3a2447;border:4px solid var(--bd);box-shadow:0 0 0 4px var(--line),0 6px 0 4px var(--line);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:15px;color:var(--txt)}
.gcard:active{transform:translateY(4px)}
.gcard b{font-size:22px;font-weight:400;color:var(--gold)}.gcard small{font-size:14px;opacity:1}.gcard i{font-style:normal;font-size:14px;color:#ffd0e2}
.gi{font-size:44px;line-height:1.1}
@media (max-height:520px){.card{padding:10px 16px;gap:4px}#pv{width:130px;height:110px}#aName{font-size:20px}h1{font-size:22px}.big{font-size:19px;padding:8px 24px}.gcard{width:185px;padding:10px}.gi{font-size:34px}.hint{font-size:12px}.sel button{width:34px;height:34px}.res{font-size:16px}}
#rot{position:fixed;left:50%;top:8px;transform:translateX(-50%);background:var(--card);border:3px solid var(--line);padding:5px 14px;font-size:13px;display:none;z-index:6}
@media (orientation:portrait){#rot.show{display:block}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot">📱 가로로 돌리면 더 넓게 보여요</div>
<div id="top"><button id="bPause">⏸</button><button id="bMute">🔊</button></div>
<div id="ctl">
  <div class="grp"><button id="cL">◀</button><button id="cR">▶</button></div>
  <div class="grp"><button id="cT">✨<small>묘기</small></button><button id="cJ">⬆<small>점프</small></button></div>
</div>

<div id="hub" class="ov"><div class="card">
  <h1>보드 동물 놀이터</h1>
  <div class="stat">🪙 <b id="hCoins">0</b></div>
  <div class="menurow">
    <button class="gcard" id="gRun"><span class="gi">🪙</span><b>코인런</b><small>달리고 점프하고<br>코인을 모아요</small><i id="gRunBest"></i></button>
    <button class="gcard" id="gRace"><span class="gi">🏁</span><b>레일 레이스</b><small>5개 레일을 타고<br>위로 달려 결승선!</small><i id="gRaceBest"></i></button>
    <button class="gcard" id="gMan"><span class="gi">🛞</span><b>매뉴얼 버티기</b><small>흔들리는 게이지를 잡고<br>몇 초 버티나? 기록 대결</small><i id="gManBest"></i></button>
  </div>
  <div class="hint">동물·보드·코인은 모든 게임에서 같이 써요</div>
</div></div>

<div id="menu" class="ov hide"><div class="card">
  <h1 id="mTitle">코인런</h1>
  <div class="menurow">
    <div class="col">
      <div class="sel"><button id="aPrev">◀</button><canvas id="pv" width="200" height="170"></canvas><button id="aNext">▶</button></div>
      <div id="aName"></div><div id="aSub"></div>
      <div class="sel"><button id="bPrev">◀</button><span id="bName"></span><button id="bNext">▶</button></div>
    </div>
    <div class="col">
      <div class="stat">🪙 <b id="tCoins">0</b> &nbsp; <span id="tBestL"></span></div>
      <button id="play" class="big">달리기!</button>
      <div class="hint" id="hint"></div>
      <button id="toHub">← 게임 선택</button>
    </div>
  </div>
</div></div>

<div id="over" class="ov hide"><div class="card">
  <h1 id="ovT">앗! 넘어졌어요</h1>
  <div class="res" id="ovR"></div>
  <div class="menurow"><button id="again" class="big">한 번 더!</button><button id="share" class="big alt" style="display:none">공유</button><button id="toMenu" class="big alt">메뉴</button></div>
</div></div>

<div id="pause" class="ov hide"><div class="card">
  <h1>잠깐 휴식</h1>
  <div class="menurow"><button id="resume" class="big">계속하기</button><button id="quit" class="big alt">그만하기</button></div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const hs=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const sn=v=>Math.round(v/3)*3;
function hex(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixA(a,b,k){const A=hex(a),B=hex(b);return[A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k]}
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function mix(a,b,k){return rgb(mixA(a,b,k))}
function shade(col,a){const[r,g,b]=hex(col),t=a<0?0:255,k=Math.abs(a);return`rgb(${r+(t-r)*k|0},${g+(t-g)*k|0},${b+(t-b)*k|0})`}

/* ---------- save ---------- */
let S={coins:0,best:0,wins:0,mbest:0,owned:['cat'],animal:'cat',board:'skate'};
try{const j=JSON.parse(localStorage.getItem('bac_v1')||'null');if(j)S=Object.assign(S,j)}catch(e){}
function save(){try{localStorage.setItem('bac_v1',JSON.stringify(S))}catch(e){}}

/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type,vol,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={
 coin:()=>{tone(988,1319,.09,'square',.03);tone(1319,1760,.1,'square',.025,.07)},
 jump:()=>tone(300,620,.16,'square',.04),
 dj:()=>tone(420,900,.18,'square',.04),
 hurt:()=>tone(300,80,.3,'sawtooth',.05),
 stomp:()=>tone(200,520,.12,'square',.05),
 land:()=>tone(170,90,.08,'square',.04),
 trick:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.02,.1,'square',.03,i*.06)),
 power:()=>[392,523,659,784].forEach((f,i)=>tone(f,f,.12,'square',.04,i*.07)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.22,'square',.05,i*.18)),
 grind:()=>tone(1800,2400,.04,'sawtooth',.01),
 tick:()=>tone(700,700,.05,'square',.03),
 go:()=>tone(660,1320,.3,'square',.05)
};

/* ---------- data ---------- */
const ANI={
 cat:{name:'냥이',sub:'호기심 많은 고양이',price:0,body:'#f6a23c',belly:'#ffe3b5',dark:'#c9782a',scarf:'#ff5f86'},
 dog:{name:'멍이',sub:'꼬리 붕붕 강아지',price:60,body:'#d8a468',belly:'#f5dfbc',dark:'#7a4f2b',scarf:'#4fb6ff'},
 penguin:{name:'뒤뚱이',sub:'뒤뚱뒤뚱 펭귄',price:120,body:'#32447a',belly:'#ffffff',dark:'#222f4d',scarf:'#ff5f86'},
 panda:{name:'대나무',sub:'느긋한 판다',price:200,body:'#ffffff',belly:'#ffffff',dark:'#2c2c34',scarf:'#7ad06b'},
 capy:{name:'카피',sub:'세상 느긋한 카피바라',price:300,body:'#b88a5a',belly:'#d6b48a',dark:'#6d4b2c',scarf:'#ffd23f'}
};
const BOARDS={
 skate:{name:'🛹 스케이트보드',col:'#ff6fa5'},
 long:{name:'🏄 롱보드',col:'#5ac8fa'},
 cruiser:{name:'🍌 크루저',col:'#ffd23f'},
 surf:{name:'🌊 서핑보드',col:'#4de3c1'},
 snow:{name:'🏂 스노우보드',col:'#a77bff'}
};
const AK=Object.keys(ANI),BK=Object.keys(BOARDS);
const BIOMES=[
 {name:'해변',sky:['#3fb4ff','#c8efff'],far:'#8fc2ea',mid:'#4fd0b4',g:'#ffe27a',gd:'#e9ab55',acc:'#ff7f9d'},
 {name:'숲속',sky:['#35a8ff','#bfe9ff'],far:'#86b6e0',mid:'#3fc247',g:'#5fd22c',gd:'#b9733a',acc:'#ffd23f'},
 {name:'설원',sky:['#6fbcff','#e4f4ff'],far:'#bcd8f6',mid:'#9cc4f0',g:'#ffffff',gd:'#a9d2f7',acc:'#7fc8ff'},
 {name:'밤도시',sky:['#2b1a78','#ff72b6'],far:'#5a43a8',mid:'#3d2e80',g:'#9a7dff',gd:'#43349a',acc:'#5df2ff'}
];
const BLEN=12000;
const biomeIdx=x=>Math.max(0,Math.floor(x/BLEN))%4;

/* ---------- canvas (low-res pixel) ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
const tc=document.createElement('canvas');tc.id='t';cv.after(tc);const tx=tc.getContext('2d');let DPR=1,CPX=2;
let VW=800,VH=450,IW=266,IH=150,U=2;
let state='hub';
function resize(){
  const cw=innerWidth,ch=innerHeight;
  U=ch>cw?Math.max(2,Math.round(cw/200)):Math.max(2,Math.round(ch/200));
  IW=Math.ceil(cw/U);IH=Math.ceil(ch/U);VW=IW*3;VH=IH*3;
  cv.width=IW;cv.height=IH;cv.style.width=cw+'px';cv.style.height=ch+'px';
  DPR=Math.min(3,window.devicePixelRatio||1);tc.width=Math.round(cw*DPR);tc.height=Math.round(ch*DPR);CPX=cw/IW;
  $('rot').classList.toggle('show',ch>cw&&state!=='play');
}
addEventListener('resize',resize);

/* ---------- sprites ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function Rr(g,col,x,y,w,h){g.fillStyle=col;g.fillRect(x,y,w,h)}
function Bk(g,x,y,w,h,col){Rr(g,col,x,y,w,h);if(h>2)Rr(g,shade(col,.25),x,y,w,1);if(h>2)Rr(g,shade(col,-.22),x,y+h-1,w,1);if(w>2)Rr(g,shade(col,-.12),x+w-1,y+1,1,h-2)}
function outline(src,col){
  const w=src.width+2,h=src.height+2,o=mk(w,h),g=o.getContext('2d'),t=mk(w,h),tg=t.getContext('2d');
  for(const[dx,dy]of[[0,1],[2,1],[1,0],[1,2]])tg.drawImage(src,dx,dy);
  tg.globalCompositeOperation='source-in';tg.fillStyle=col||'#2a1738';tg.fillRect(0,0,w,h);
  g.drawImage(t,0,0);g.drawImage(src,1,1);return o;
}
function fromRows(rows,pal,oc){
  const h=rows.length,w=rows[0].length,c=mk(w,h),g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}));
  return outline(c,oc);
}
const SP={};
function buildAnimal(k,pose){
  const A=ANI[k],c=mk(26,26),g=c.getContext('2d'),col=A.body,dark=A.dark,ink='#2a1738';
  const limb=k==='panda'?dark:k==='penguin'?'#ffa63d':shade(col,-.18);
  const arm=k==='panda'?dark:k==='penguin'?A.dark:col;
  const lift=pose===2?2:0,l0=pose===0?1:0,l1=pose===1?1:0;
  Bk(g,pose===2?7:8,22-lift-l0,3,4,limb);Bk(g,pose===2?16:15,22-lift-l1,3,4,limb);
  if(k==='cat'){Bk(g,19,(pose===2?16:18),4,2,col);Rr(g,dark,22,(pose===2?16:18),1,2)}
  if(k==='dog'){Bk(g,19,pose===1?16:18,3,2,col)}
  if(k==='panda')Bk(g,18,19,3,3,'#ffffff');
  Bk(g,9,15,8,7,col);
  if(k!=='panda')Bk(g,11,16,4,5,A.belly);
  if(k==='panda'){Rr(g,dark,9,15,8,1)}
  const ay=pose===2?11:(pose===0?14:16),ay2=pose===2?11:(pose===0?16:14);
  Bk(g,7,ay,2,5,arm);Bk(g,17,ay2,2,5,arm);
  const sc=A.scarf;
  Bk(g,8,13,10,2,sc);
  if(pose===0)Rr(g,sc,2,12,6,2);else if(pose===1)Rr(g,sc,2,14,6,2);else{Rr(g,sc,1,11,7,2);Rr(g,sc,0,9,2,3)}
  if(k==='capy'){
    Bk(g,6,2,2,2,dark);Bk(g,18,2,2,2,dark);
    Bk(g,5,4,16,9,col);
  }else{
    if(k==='cat'){Bk(g,6,0,3,3,col);Bk(g,17,0,3,3,col);Rr(g,'#ffb3c4',7,1,1,2);Rr(g,'#ffb3c4',18,1,1,2)}
    if(k==='panda'){Bk(g,6,0,3,3,dark);Bk(g,17,0,3,3,dark)}
    if(k==='dog'){Bk(g,3,4,3,7,dark);Bk(g,20,4,3,7,dark)}
    Bk(g,6,3,14,10,col);
    if(k==='cat'){Rr(g,dark,11,3,1,2);Rr(g,dark,13,3,1,3);Rr(g,dark,15,3,1,2)}
    if(k==='dog')Rr(g,'#9a6a3a',15,3,4,3);
    if(k==='penguin')Bk(g,8,6,10,6,'#ffffff');
  }
  if(k==='capy'){Rr(g,ink,8,8,3,1);Rr(g,ink,15,8,3,1)}
  else if(k==='panda'){Rr(g,dark,8,6,4,5);Rr(g,dark,14,6,4,5);Rr(g,'#fff',9,7,1,1);Rr(g,'#fff',15,7,1,1)}
  else{Rr(g,ink,9,7,2,3);Rr(g,ink,15,7,2,3);Rr(g,'#fff',9,7,1,1);Rr(g,'#fff',15,7,1,1)}
  if(k!=='panda'){Rr(g,'#ff9bb0',7,10,2,1);Rr(g,'#ff9bb0',17,10,2,1)}
  if(k==='cat'){Rr(g,'#ff7f9f',12,9,2,1);Rr(g,ink,12,10,2,1);Rr(g,'#fff',3,9,3,1);Rr(g,'#fff',20,9,3,1)}
  if(k==='dog'){Bk(g,9,10,8,3,A.belly);Rr(g,ink,12,10,2,1);Rr(g,'#ff8fa3',13,12,1,2)}
  if(k==='penguin'){Rr(g,'#ffa63d',11,9,4,2)}
  if(k==='panda'){Rr(g,ink,12,10,2,1)}
  if(k==='capy'){Bk(g,10,9,6,3,shade(col,-.28));Rr(g,ink,11,10,1,1);Rr(g,ink,14,10,1,1);Bk(g,11,0,4,3,'#ffd23f');Rr(g,'#5ec45a',13,0,2,1)}
  return outline(c);
}
function animalSpr(k,pose){const id='a'+k+pose;return SP[id]||(SP[id]=buildAnimal(k,pose))}
const BUP={skate:5,long:6,cruiser:6,surf:5,snow:5};
function buildBoardSide(key){
  const col=BOARDS[key].col,wh='#f6f1ff',wd='#8a7aa8';let c,g;
  if(key==='skate'){c=mk(26,7);g=c.getContext('2d');Bk(g,1,2,24,2,col);Rr(g,col,0,1,2,1);Rr(g,col,24,1,2,1);[4,19].forEach(x=>{Rr(g,wh,x,4,3,3);Rr(g,wd,x+1,5,1,1)})}
  if(key==='long'){c=mk(38,8);g=c.getContext('2d');Bk(g,2,2,34,2,col);Rr(g,col,0,1,3,1);Rr(g,col,35,1,3,1);Rr(g,'rgba(255,255,255,.55)',6,2,26,1);[6,28].forEach(x=>{Rr(g,wh,x,4,4,4);Rr(g,wd,x+1,5,2,2)})}
  if(key==='cruiser'){c=mk(32,9);g=c.getContext('2d');Bk(g,0,1,4,2,col);Bk(g,3,3,26,2,col);Bk(g,28,1,4,2,col);[6,22].forEach(x=>{Rr(g,'#fff3c4',x,5,4,4);Rr(g,wd,x+1,6,2,2)})}
  if(key==='surf'){c=mk(42,6);g=c.getContext('2d');Rr(g,col,8,1,26,1);Rr(g,col,3,2,38,1);Rr(g,col,0,3,42,1);Rr(g,shade(col,-.25),3,4,36,1);Rr(g,shade(col,-.35),10,5,20,1);Rr(g,'#fff',6,2,30,1);Rr(g,'#2bb89a',8,5,3,1)}

function addSeg(x0,y0,x1,y1,o){segs.push(Object.assign({x0,y0,x1,y1,bi:biomeIdx(x0)},o))}

function surfAt(x,yref,tol){let best=null,bd=1e9;for(const s of segs){if(x<s.x0||x>s.x1)continue;const y=segY(s,x),dd=Math.abs(y-yref);if(dd<tol&&dd<bd){bd=dd;best={y,s}}}return best}

function slope(len,dh,o){const x=genX;addSeg(x,genY,x+len,genY+dh,o);genX+=len;genY+=dh;return x}
function coin(x,y,k){items.push({k:k||'coin',x,y,t:rnd(0,6),got:false})}

function collectCoin(it){

function updatePlay(dt){
  const d=dist();P.t+=dt;runT+=dt;
  for(const k of['inv','boost','mag','stun'])if(P[k]>0)P[k]-=dt;
  if(P.comboT>0){P.comboT-=dt;if(P.comboT<=0)P.combo=0}
  const ax=keys.r-keys.l,base=210+Math.min(d,1200)*.07;
  let target=P.boost>0?540:base+ax*95,slp=0;
  if(P.on&&P.seg&&!P.seg.plat)slp=(P.seg.y1-P.seg.y0)/((P.seg.x1-P.seg.x0)||1);
  if(P.on&&!P.rail)target+=slp*170;
  if(P.rail)target=Math.max(target,260);
  const acc=P.boost>0?900:(ax?650:380);
  P.vx+=clamp(target-P.vx,-acc*dt,acc*dt);P.vx=clamp(P.vx,P.stun>0?60:85,620);
  if(P.buf>0)P.buf-=dt;
  if(P.on)P.coy=.1;else P.coy-=dt;
  if(P.buf>0){if(P.coy>0)doJump(620,1);else if(P.jumps<2)doJump(540,2)}
  if(!keys.j&&P.vy<-240&&P.jumpCut&&!P.on){P.vy=-240;P.jumpCut=false}
  const py=P.y;P.x+=P.vx*dt;
  if(P.on){
    const g=surfAt(P.x,py,34);
    if(g){P.dy=g.y-py;P.y=g.y;P.vy=0;P.seg=g.s;P.rail=!!g.s.rail;

        if(Math.random()<.7)parts.push({x:P.x-10,y:P.y,vx:rnd(-90,-20),vy:rnd(-120,-20),life:.3,max:.3,col:'#ffe27a',s:1})}
    }else{
      P.on=false;P.rail=false;P.vy=clamp(P.dy/dt,-700,500);P.air0=0;

    }
  }
  if(!P.on){
    P.air0+=dt;P.vy+=((keys.j&&P.vy<0)?1250:1500)*dt;P.y+=P.vy*dt;
    if(P.vy>=0){
      let cy=null,cs=null;

        P.sq=clamp(P.vy/700,.2,1);SFX.land();puff(P.x,P.y,6,'#fff',80,10);P.vy=0;
        if(P.trick){

          else{P.vx*=.75;pop(P.x,P.y-100,'아차!','#b9a3d9')}

        }

    }
  }
  if(P.trick){P.trickT+=dt;if(P.trickT>=.55)P.trickDone=true}
  if(P.sq>0)P.sq=Math.max(0,P.sq-dt*5);
  let tr;
  if(P.on){tr=P.seg&&!P.seg.plat?Math.atan2(P.seg.y1-P.seg.y0,P.seg.x1-P.seg.x0):0}
  else tr=clamp(P.vy*.0006,-.45,.55);

  const mag=P.mag>0||P.boost>0;
  for(const it of items){
    if(it.got)continue;
    const cy=P.y-44,dx=it.x-P.x,dy=it.y-cy;
    if(mag&&(it.k==='coin'||it.k==='star')&&Math.abs(dx)<200&&Math.abs(dy)<200){const dd=Math.hypot(dx,dy)||1,sp=640*dt;it.x-=dx/dd*Math.min(sp,dd);it.y-=dy/dd*Math.min(sp,dd)}
    if(dx*dx+dy*dy<(it.k==='star'?42:34)**2)collectCoin(it);
  }
  for(const e of enemies){
    if(e.dead)continue;

  if(cam.sh>0)cam.sh=Math.max(0,cam.sh-dt*30);
  const m=Math.floor(d/100);if(m>P.mile){P.mile=m;toast(m*100+'m!',1.2)}
  const bi=Math.floor(P.x/BLEN);if(bi>P.bi&&P.x>0){P.bi=bi;toast(BIOMES[bi%4].name+'에 도착!',2)}
  if(P.vx>400&&Math.random()<.5)parts.push({x:P.x-40,y:P.y-rnd(10,70),vx:-320,vy:0,life:.25,max:.25,col:'rgba(255,255,255,.8)',s:2});
}
function updateDying(dt){P.vy+=1500*dt;P.y+=P.vy*dt;P.x+=P.vx*dt*.3;P.rot+=dt*9;cam.x=P.x-VW*.3}
function stepAll(dt){

}

const RL=900;

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function genRows(){
  const rows=[];let m=48;
  while(m<RL-45){
    const d=m/RL,r=Math.random();
    if(r<.32){
      const n=1+(Math.random()<.4+d*.3?1:0)+(Math.random()<d*.4?1:0),ls=shuf([0,1,2,3,4]).slice(0,n);
      ls.forEach(l=>rows.push({k:'cone',m,l}));
      const fl=[0,1,2,3,4].filter(l=>!ls.includes(l)),cl=fl[Math.floor(Math.random()*fl.length)];
      for(let i=0;i<4;i++)rows.push({k:'coin',m:m-11+i*2.6,l:cl});
    }else if(r<.5){
      const l=Math.floor(Math.random()*5);
      for(let i=0;i<7;i++){const ll=clamp(l+Math.round(Math.sin(i*.9)*1.4),0,4);rows.push({k:'coin',m:m+i*2.8,l:ll})}
    }else if(r<.62){
      const l=Math.floor(Math.random()*5);rows.push({k:'pad',m,l});

  }else{

    c.fillStyle='rgba(0,0,0,.12)';const off=M.scroll%420;for(let i=0;i<40;i++){const x=((hs(i*3.7)*VW*1.6-off)%VW+VW)%VW,y=roadTop+9+hs(i*9.3)*(rh-18);c.fillRect(sn(x),sn(y),6,6)}
    c.fillStyle='#d7d2e8';const o2=M.scroll%180;for(let x=-o2;x<VW;x+=180)c.fillRect(sn(x),sn(roadTop+rh*.55),90,6);
  }
  // wind streaks
  if(M.gust>0||M.windWarn>0){c.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<9;i++){const dir=-M.gustDir,x=(((M.t*700*dir+i*211)%(VW+200))+VW+200)%(VW+200)-100,y=VH*(.1+i*.07);c.fillRect(sn(x),sn(y),96,3)}}
  // rider
  const SC=6,py=sn(roadTop+rh*.5),px=cx-40;
  let ang=-.33+M.b*.45;ang=Math.round(ang/.07)*.07;
  c.save();
  let ox=0,oy=0,rot=ang;
  if(M.fall){const f=M.fallT;ox=f*300;oy=-Math.max(0,420*f-900*f*f);rot=ang+f*9}
  const jit=(tact&&M.started&&!M.fall)?(Math.floor(M.t*30)%2?3:0):0;
  c.translate(sn(px+ox),sn(py+oy-jit));c.fillStyle='rgba(0,0,0,.2)';if(!M.fall)c.fillRect(-60,jit,300,9);
  c.rotate(rot);c.translate(REAR[S.board]*SC,0);
  drawRider(c,S.animal,S.board,{t:M.started?M.t:0,air:!!M.fall,sc:SC});
  c.restore();
  c.restore();
  // gauge
  const gw=Math.min(VW*.64,800),gh=51,gx=sn(cx-gw/2),gy=sn(VH*.37),d=clamp(M.t/40,0,1),z=.34-.14*d;
  c.fillStyle='#1b0f26';c.fillRect(gx-12,gy-12,gw+24,gh+24);
  c.fillStyle='#d94a5a';c.fillRect(gx,gy,gw,gh);
  c.fillStyle='#ffb84a';const zs=Math.min(1,z*1.9);c.fillRect(sn(cx-zs*gw/2),gy,sn(zs*gw),gh);
  c.fillStyle='#4fd16a';c.fillRect(sn(cx-z*gw/2),gy,sn(z*gw),gh);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(sn(cx-z*gw/2),gy,sn(z*gw),9);
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(cx-1.5|0,gy,3,gh);
  const kx=sn(cx+clamp(M.b,-1,1)*gw/2),out=Math.abs(M.b)>z;
  c.fillStyle='#1b0f26';c.fillRect(kx-12,gy-18,24,gh+36);c.fillStyle=out&&Math.floor(performance.now()/120)%2?'#ff5f6f':'#fff';c.fillRect(kx-6,gy-12,12,gh+24);
  const st=M.started;
  if(st){txt(c,'◀ 떼면 뒤로',gx,gy+gh+39,36,'#fff');txt(c,'누르면 앞으로 ▶',gx+gw,gy+gh+39,36,'#fff','right');txt(c,'안전',cx,gy+gh/2,39,'#fff','center')}
  if(M.out>0){c.fillStyle='#1b0f26';c.fillRect(sn(cx-150)-3,gy-42,306,18);c.fillStyle='#ff5f6f';c.fillRect(sn(cx-150),gy-39,sn(300*clamp(M.out/.6,0,1)),12)}
  // HUD
  if(st){txt(c,M.t.toFixed(1),cx-30,60,96,'#fff','center');txt(c,'초',cx+96,72,42,'#fff','center');
  txt(c,M.ph.name,cx,138,42,pi>=1?'#ffd23f':'#fff','center');
  if(VW>900)txt(c,'최고 '+S.mbest.toFixed(1)+'초',24,36,33,'#fff');else txt(c,'최고 '+S.mbest.toFixed(1)+'초',cx,190,33,'#fff','center')}
  if(M.windWarn>0&&!M.fall)txt(c,M.gustDir<0?'◀◀ 맞바람!':'뒷바람 ▶▶',cx,gy+gh+105,60,'#ff8f8f','center');
  else if(M.gust>0&&!M.fall)txt(c,M.gustDir<0?'◀◀◀':'▶▶▶',cx,gy+gh+105,60,'#ffd23f','center');
  if(!M.started){
    c.fillStyle='rgba(20,10,34,.66)';c.fillRect(0,0,VW,VH);
    const fs=Math.min(45,VW/21),lh=fs*1.75,y0=VW>900?VH*.2:VH*.1;
    const L=[['🛞 매뉴얼 버티기',fs*1.4,'#ffd36b'],['꾹 누르기 = 몸이 앞으로 ▶',fs,'#fff'],['떼기 = 몸이 뒤로 ◀',fs,'#fff'],['초록 구간을 벗어나면 넘어져요!',fs,'#8dff8d'],['바람·점자블록·자갈길이 흔들어요',fs,'#fff']];
    let yy=y0;for(const l of L){txt(c,l[0],cx,yy,l[1],l[2],'center');yy+=lh*(l[1]>fs?1.15:1)}
    if(Math.floor(performance.now()/450)%2)txt(c,'👇 화면을 꾹 눌러 시작!',cx,Math.min(VH-60,yy+lh*.6),fs*1.15,'#ffd36b','center');
  }else if(M.t<6&&!M.fall)txt(c,'꾹 = 앞으로 · 떼면 = 뒤로',cx,VH*.62,Math.min(42,VW/20),'#fff','center');
  if(M.fall)txt(c,'쿵!',cx,VH*.48,120,'#ff8f8f','center');
}

/* ---------- menu ---------- */
const pvc=$('pv').getContext('2d');
function setHubStats(){$('hCoins').textContent=S.coins;$('gRunBest').textContent=S.best?'🏆 최고 '+S.best+'점':'';$('gRaceBest').textContent=S.wins?'🥇 우승 '+S.wins+'회':'';$('gManBest').textContent=S.mbest?'⏱ 최고 '+S.mbest.toFixed(1)+'초':''}
function openMenu(){
  state='menu';$('hub').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('menu').classList.remove('hide');
  $('mTitle').textContent=mode==='race'?'🏁 레일 레이스':mode==='manual'?'🛞 매뉴얼 버티기':'🪙 코인런';resetWorld();cam.x=0;cam.y=0;setUI();
}
function showHub(){
  state='hub';$('menu').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('hub').classList.remove('hide');
  resetWorld();cam.x=0;cam.y=0;setHubStats();setUI();
}
$('gRun').onclick=()=>{ac();mode='run';openMenu()};
$('gRace').onclick=()=>{ac();mode='race';openMenu()};
$('gMan').onclick=()=>{ac();mode='manual';openMenu()};
$('toHub').onclick=showHub;
const touch=(()=>{try{return/[?&]touch=1/.test(location.search)||matchMedia('(pointer:coarse)').matches||('ontouchstart' in window)}catch(e){return false}})();
function refreshMenu(){
  const a=ANI[S.animal],own=S.owned.includes(S.animal);
  $('aName').textContent=a.name+(own?'':' 🔒');$('aSub').textContent=a.sub;$('bName').textContent=BOARDS[S.board].name;
  $('tCoins').textContent=S.coins;$('tBestL').innerHTML=mode==='race'?'🥇 우승 <b>'+S.wins+'</b>회':mode==='manual'?'⏱ 최고 <b>'+S.mbest.toFixed(1)+'</b>초':'🏆 최고 <b>'+S.best+'</b>점';
  $('hint').innerHTML=mode==='manual'?'👆 꾹 누르면 앞으로 · 떼면 뒤로 쏠려요<br>🟩 초록 구간 안에서 최대한 오래 버티기!<br>🌬 맞바람·점자블록·자갈길이 흔들어요':mode==='race'?(touch?'◀▶ 레일 이동 (화면 스와이프도 OK) · ⬆ 점프<br>코인 연속으로 먹으면 가속, 파란 패드는 부스트!':'← → 레일 이동 · Space 점프<br>코인 연속으로 먹으면 가속, 파란 패드는 부스트!'):(touch?'◀▶ 속도 조절 · ⬆ 점프(두 번 누르면 2단) · ✨ 공중에서 묘기!<br>코인을 모으고 적은 밟아요':'← → 속도 · Space 점프(2단) · ↓ / Z 공중 묘기 · P 일시정지<br>코인을 모으고 적은 밟아요');
  $('play').textContent=own?'달리기!':`🔒 ${a.price}🪙로 열기`;$('play').classList.toggle('alt',!own);
}
function setUI(){
  $('top').style.display=(state==='play'||state==='pause')?'flex':'none';
  $('ctl').style.display=(touch&&mode!=='manual'&&(state==='play'||state==='pause'))?'flex':'none';
  $('cT').style.display=mode==='race'?'none':'';
  $('rot').classList.toggle('show',innerHeight>innerWidth&&state!=='play');
  refreshMenu();
}
$('aPrev').onclick=()=>{S.animal=AK[(AK.indexOf(S.animal)+AK.length-1)%AK.length];save();refreshMenu()};
$('aNext').onclick=()=>{S.animal=AK[(AK.indexOf(S.animal)+1)%AK.length];save();refreshMenu()};
$('bPrev').onclick=()=>{S.board=BK[(BK.indexOf(S.board)+BK.length-1)%BK.length];save();refreshMenu()};
$('bNext').onclick=()=>{S.board=BK[(BK.indexOf(S.board)+1)%BK.length];save();refreshMenu()};
$('play').onclick=()=>{
  ac();const a=ANI[S.animal];
  if(!S.owned.includes(S.animal)){
    if(S.coins>=a.price){S.coins-=a.price;S.owned.push(S.animal);save();SFX.power();refreshMenu()}
    else{$('hint').textContent=`코인이 모자라요 (${S.coins}/${a.price}) — 달려서 모아봐요!`}
    return;
  }
  startRun();
};
$('again').onclick=()=>{ac();startRun()};
$('toMenu').onclick=()=>openMenu();
function pause(){if(state!=='play')return;state='pause';$('pause').classList.remove('hide');setUI()}
function resume(){if(state!=='pause')return;state='play';if(M)M.hold=false;$('pause').classList.add('hide');setUI()}
$('resume').onclick=resume;
$('quit').onclick=()=>{if(mode==='manual'){}else if(mode==='race'){S.coins+=R.coins}else{S.coins+=P.coins;const sc=score();if(sc>S.best)S.best=sc}save();setHubStats();openMenu()};
$('bPause').onclick=pause;
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- input ---------- */
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{
  const isJump=e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW';
  if(e.repeat&&(isJump||KM[e.code]))return;
  if(KM[e.code]){e.preventDefault();if(mode==='race')laneMove(KM[e.code]==='l'?-1:1);else keys[KM[e.code]]=1}
  if(isJump){e.preventDefault();if(state==='play'){if(mode==='manual')mHold(true);else if(mode==='race')raceJump();else{keys.j=1;P.buf=.12}}else if(state==='over')startRun()}
  if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='KeyZ'||e.code==='ShiftLeft'||e.code==='KeyX'){e.preventDefault();doTrick()}
  if(e.code==='KeyP'||e.code==='Escape'){state==='pause'?resume():pause()}
  if(e.code==='Enter'&&state==='menu')$('play').click();
});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.j=0;mHold(false)}});
function bindBtn(id,down,up){const b=$(id);
  const d=e=>{e.preventDefault();ac();b.classList.add('on');down()},u=e=>{e.preventDefault();b.classList.remove('on');up&&up()};
  b.addEventListener('pointerdown',d);b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
  b.addEventListener('contextmenu',e=>e.preventDefault())}
bindBtn('cL',()=>{if(mode==='race')laneMove(-1);else keys.l=1},()=>keys.l=0);
bindBtn('cR',()=>{if(mode==='race')laneMove(1);else keys.r=1},()=>keys.r=0);
bindBtn('cJ',()=>{if(state!=='play')return;if(mode==='race')raceJump();else{keys.j=1;P.buf=.12}},()=>keys.j=0);
bindBtn('cT',()=>doTrick(),null);
let sw=null;
cv.addEventListener('pointerdown',e=>{ac();if(state==='play'&&mode==='manual'){try{cv.setPointerCapture(e.pointerId)}catch(_){}mHold(true)}if(state==='play'&&mode==='race'){sw={x:e.clientX,y:e.clientY,moved:false}}});
cv.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x;if(Math.abs(dx)>34){laneMove(dx>0?1:-1);sw.x=e.clientX;sw.moved=true}});
cv.addEventListener('pointerup',e=>{mHold(false);if(sw&&!sw.moved&&Math.abs(e.clientY-sw.y)<12)raceJump();sw=null});
cv.addEventListener('pointercancel',()=>{sw=null;mHold(false)});

/* ---------- loop ---------- */
let last=performance.now(),menuT=0;
function drawRacerPv(g){
  const pose=Math.floor(menuT*6)%2,A=animalSpr(S.animal,pose),Bd=boardTop(S.board);
  g.save();g.scale(3.4,3.4);g.drawImage(Bd,-(Bd.width/2|0),-4);g.drawImage(A,-14,-28);g.restore();
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){if(mode==='manual')updateManual(dt);else if(mode==='race')updateRace(dt);else{updatePlay(dt);stepAll(dt)}}
  else if(state==='dying'){updateDying(dt);stepAll(dt)}
  else if(state==='menu'||state==='hub'){cam.x+=70*dt;cam.y=-40;menuT+=dt;stepAll(dt)}
  else if(state==='over'&&mode==='run'){stepAll(dt*.2)}
  ctx.setTransform(1/3,0,0,1/3,0,0);ctx.imageSmoothingEnabled=false;
  tx.setTransform(1,0,0,1,0,0);tx.clearRect(0,0,tc.width,tc.height);
  if(mode==='manual'&&M&&(state==='play'||state==='pause'||state==='over'))renderManual(ctx);else if(mode==='race'&&R&&(state==='play'||state==='pause'||state==='over'))renderRace(ctx);else renderRun(ctx);
  if(state==='menu'){
    pvc.setTransform(1,0,0,1,0,0);pvc.imageSmoothingEnabled=false;pvc.clearRect(0,0,200,170);
    pvc.save();pvc.translate(100,160);pvc.fillStyle='rgba(0,0,0,.25)';pvc.fillRect(-46,0,92,5);
    pvc.translate(0,Math.sin(menuT*4)>0?-2:0);
    if(mode==='race')drawRacerPv(pvc);else drawRider(pvc,S.animal,S.board,{t:menuT,air:false,sc:3.4});
    pvc.restore();
    if(!S.owned.includes(S.animal)){pvc.fillStyle='rgba(20,10,30,.5)';pvc.fillRect(0,0,200,170)}
  }
  requestAnimationFrame(frame);
}
window.__dbg={get M(){return M},mHold,get P(){return P},get R(){return R},get state(){return state},get mode(){return mode},get segs(){return segs},get enemies(){return enemies},get items(){return items},keys,startRun,get cam(){return cam},S,die,
  setMode:m=>{mode=m},setBoard:b=>{S.board=b},setAnimal:a=>{S.animal=a},doTrick,jump:()=>{keys.j=1;P.buf=.12;setTimeout(()=>keys.j=0,120)},laneMove,raceJump};
resize();showHub();requestAnimationFrame(frame);
})();
</script>
